# CI for the walking skeleton (docs/plan-v1.0.md §13.3). Tool versions come from
# go.mod / tools/go.mod / .env.example so CI and laptops run the same binaries.
#
#   lint ─┐
#   unit ─┼─► integration ─► image
#   gen-check, compose-config, contracts run alongside.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the commit range
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go vet + golangci-lint (depguard, forbidigo, ...)
        run: make lint
      - name: go.mod / go.sum are tidy
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: unit + property tests (-race)
        run: make test
      - name: coverage gate (internal/money >= 95%)
        run: make cover-money
      - name: exchange / exchangectl smoke
        run: |
          make build
          bin/exchange version
          bin/exchangectl version
          bin/exchange admin bootstrap && exit 1 || test $? -eq 3   # not implemented yet -> exit 3

  gen-check:
    name: gen-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: generated code is in sync (oapi-codegen, sqlc)
        run: make gen-check
      - name: sqlc vet
        run: go tool -modfile=tools/go.mod sqlc vet -f sqlc.yaml

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file renders with every profile
        run: make compose-config
      - name: dev secrets script parses
        run: bash -n scripts/gen-dev-secrets.sh

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/contracts
    steps:
      - uses: actions/checkout@v4
      - name: read pinned foundry version
        id: foundry
        run: echo "tag=$(sed -n 's/^FOUNDRY_TAG=//p' ../../.env.example)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.foundry.outputs.tag }}
      - run: forge build --sizes
      - run: forge test -vv

  integration:
    name: integration
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: testcontainers (postgres) — migrate, seed, GET /v1/markets
        env:
          CI: "true" # a missing Docker daemon fails instead of skipping
        run: make test-integration

  image:
    name: image
    needs: [integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: crypto-exchange:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image smoke
        run: |
          docker run --rm crypto-exchange:ci version
          docker run --rm --entrypoint /exchangectl crypto-exchange:ci version
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
