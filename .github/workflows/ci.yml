# CI for the walking skeleton (docs/plan-v1.0.md §13.3). Tool versions come from
# go.mod / tools/go.mod / .env.example so CI and laptops run the same binaries.
#
#   lint ─┐
#   unit ─┼─► integration ─┬─► e2e
#        │                 └─► image
#        └─► fuzz-smoke (push only: main merges and v* tags)
#   fast-checks runs alongside: generated code, compose rendering, contracts.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Documentation-only pull requests skip CI. A full run is ~30 minutes of
  # runner time across nine jobs, and nothing here reads docs/ or any .md --
  # the only non-Go files the tests load are .env.example,
  # deploy/seed-params/*.json and test/fixtures/*.json, none of which are
  # filtered below. Path filters on pull_request are evaluated against the
  # whole PR diff, so a branch that touches code *and* docs still runs.
  #
  # Deliberately not applied to push: a v* tag cut from a docs-only commit
  # would skip the image job and ship a release with no image, and main is
  # every branch's base -- it is worth one full run per merge to know that
  # every commit on it has been verified.
  #
  # If main ever gains branch protection with these checks marked required,
  # this filter makes docs-only PRs unmergeable: the required check never
  # reports. The fix then is GitHub's documented pattern -- a second workflow
  # with the same job names that succeeds on the filtered paths.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits to pick its scan range
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the commit range
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: go vet + golangci-lint (depguard, forbidigo, ...)
        run: make lint
      - name: go.mod / go.sum are tidy
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: unit + property tests (-race)
        run: make test
      - name: coverage gate (internal/money >= 95%)
        run: make cover-money
      - name: matching property tests at full strength (>= 1,000 sequences each; -short runs 200)
        run: go test -race -count=1 -run 'TestProperty' ./internal/matching/
      - name: exchange / exchangectl smoke
        run: |
          make build
          bin/exchange version
          bin/exchangectl version
          # the seed import is implemented now; without a mnemonic it must fail
          # cleanly (exit 1) rather than panic or silently write a keystore
          bin/exchange keys import-mnemonic --from /dev/null --keystore-dir "$RUNNER_TEMP/ks" && exit 1 || test $? -eq 1
          test ! -e "$RUNNER_TEMP/ks/hd-seed.json"

  # Four billable minutes for one fuzz target -- FuzzApply in internal/matching
  # is the only one in the repository. push covers both `branches: [main]` and
  # `tags: ["v*"]`, so every merge and every release still fuzzes it; what a
  # pull request gives up is 30 seconds of fuzzing on a single target, for the
  # hours between opening the PR and merging it.
  #
  # docs/plan-v1.0.md §13.3 requires every Fuzz* for 30s with failing corpora
  # committed to testdata/fuzz. That is about strength and what to do with a
  # failure, not about which events run it.
  fuzz-smoke:
    name: fuzz-smoke
    needs: [unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: every Fuzz* target for 30s (docs/plan-v1.0.md §13.3)
        run: make test-fuzz FUZZ_TIME=30s

  # gen-check, compose-config and contracts used to be three jobs. Between
  # them they did about five seconds of work and cost three billable minutes,
  # because GitHub rounds every job up to a whole minute and two of the three
  # spent most of their wall time installing a toolchain: gen-check took 54s,
  # of which 32s was setup-go and 2s was the check.
  #
  # The cost of merging is one red check named fast-checks instead of a red
  # check named contracts. GitHub still names the failing step, so what is
  # actually lost is the name on the summary line, and it buys two thirds of
  # this job's bill back.
  #
  # Nothing depends on these: only integration (lint, unit), fuzz-smoke (unit),
  # e2e and image (integration) declare needs.
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: read pinned foundry version
        id: foundry
        run: echo "tag=$(sed -n 's/^FOUNDRY_TAG=//p' .env.example)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ steps.foundry.outputs.tag }}

      - name: compose file renders with every profile
        run: make compose-config
      - name: dev scripts parse
        # e2e.sh is checked here rather than only by the e2e job: this job
        # finishes in seconds, and a syntax error found twelve minutes into a
        # container run is twelve minutes wasted.
        run: bash -n scripts/gen-dev-secrets.sh && bash -n scripts/e2e.sh
      - name: generated code is in sync (oapi-codegen, sqlc)
        run: make gen-check
      - name: sqlc vet
        run: go tool -modfile=tools/go.mod sqlc vet -f sqlc.yaml
      # working-directory is per-step, not a job default: a job-level default
      # would send make gen-check and make compose-config into infra/contracts.
      - name: forge build
        working-directory: infra/contracts
        run: forge build --sizes
      - name: forge test
        working-directory: infra/contracts
        run: forge test -vv

  integration:
    name: integration
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: testcontainers (postgres, nats) — migrate, seed, registry API, ledger, admin API, trading engine, outbox relay
        env:
          CI: "true" # a missing Docker daemon fails instead of skipping
        run: make test-integration

  e2e:
    name: e2e
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # api, engine and admin run as separate containers, so every order has
      # to travel over the NATS command bus to reach the engine. This is the
      # only job that exercises the split deployment (docs/plan-v1.0.md §13.3).
      - name: compose app profile — exchangectl e2e, engine kill -9, market halt
        env:
          KEEP: "1" # tear down in the step below, so the logs survive a failure
        run: make e2e
      - name: collect container logs
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env --profile infra --profile app logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
      - name: tear down
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env --profile infra --profile app down -v --remove-orphans || true

  image:
    name: image
    needs: [integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: crypto-exchange:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image smoke
        run: |
          docker run --rm crypto-exchange:ci version
          docker run --rm --entrypoint /exchangectl crypto-exchange:ci version
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
