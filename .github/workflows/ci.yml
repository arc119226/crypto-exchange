# CI for the walking skeleton (docs/plan-v1.0.md §13.3). Tool versions come from
# go.mod / tools/go.mod / .env.example so CI and laptops run the same binaries.
#
#   checks ─┬─► integration ─┬─► e2e  ─┐
#           │                 ├─► helm ─┼─► release (v* tags: chart to ghcr, GitHub Release)
#           │                 └─► image ┘
#           └─► fuzz-smoke (push only: main merges and v* tags)
#
#   checks is lint, the unit and property suites, the generated-code and
#   compose checks, the web build and the Solidity contracts, in one job.
#
#   A merge to main runs only fuzz-smoke and image; see below for why.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Documentation-only pull requests skip CI. A full run is ~30 minutes of
  # runner time across nine jobs, and nothing here reads docs/ or any .md --
  # the only non-Go files the tests load are .env.example,
  # deploy/seed-params/*.json and test/fixtures/*.json, none of which are
  # filtered below. Path filters on pull_request are evaluated against the
  # whole PR diff, so a branch that touches code *and* docs still runs.
  #
  # Deliberately not applied to push: a v* tag cut from a docs-only commit
  # would skip the image job and ship a release with no image.
  #
  # The one thing here that does read docs/ is test/docs/, so this filter was
  # silencing the only tests a documentation change can fail. docs.yml is the
  # complement -- its `paths` is exactly the two patterns below -- and runs
  # `make docs-test` on the pull requests this filter declines. Keep the two
  # lists in step.
  #
  # If main ever gains branch protection with these checks marked required,
  # this filter makes docs-only PRs unmergeable: the required check never
  # reports. The fix then is GitHub's documented pattern -- a second workflow
  # with the same job names that succeeds on the filtered paths, which is the
  # shape docs.yml already has.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# What a merge to main runs, and why it is almost nothing.
#
# This repository is developed one pull request at a time, from a branch cut
# off the current main and merged as soon as it is green. Under that rule main
# does not move between the branch point and the merge, so the merge commit's
# tree is the pull request head's tree -- not equivalent, identical. Measured
# on the last three merges: 45d3dc4d, 430e8ac9 and f768d745 each appear as
# both the merge commit's tree and its second parent's.
#
# So checks, integration and e2e on main re-test a tree that
# passed minutes earlier, for about 28 billable minutes a merge. They are
# skipped there. Two jobs are not, because they are the only things a merge
# does that the pull request did not:
#
#   fuzz-smoke  the only place fuzzing runs at all; pull requests skip it
#   image       its ghcr login and push steps are push-only
#
# Both keep their `needs`, with an `if` that accepts a skipped dependency --
# without it the skip would cascade and the merge would run nothing.
#
# THE CONDITION THIS RESTS ON: one pull request in flight at a time. Merge a
# second one while the first is open and the merge commit's tree stops
# matching what CI saw, and nothing on main would test the combination. If
# this repository ever gains concurrent branches, delete the five `if` lines
# rather than reasoning about which merges are still safe. `git rev-parse
# <merge>^{tree} <merge>^2^{tree}` is how to check whether the premise still
# holds.
#
# Tags are untouched: a release is verified on its own, in full.

# Where the jobs run.
#
# This repository is private, so every minute of a GitHub-hosted runner is
# billed. Measured over the first 3.2 days, 88 runs: 2,492 billable minutes,
# which annualises to about 23,400 a month against a 3,000-minute allowance.
# The arithmetic does not work at any optimisation level -- 810 runs a month
# into 3,000 minutes is 3.7 minutes per run, and one `go build -race` plus a
# testcontainers suite is already past that. So the default is a self-hosted
# runner, and the workflow only needs a repository variable to say so:
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   CI_RUNNER = exchange-ci        (the label given to the runner)
#
# Unset the variable and every job falls back to ubuntu-latest, so a dead
# VPS costs money rather than a red X, and recovery is one click with no
# commit. docs/guides/self-hosted-runner.md has the machine setup.
#
# release stays pinned to ubuntu-latest: it publishes to ghcr and cuts the
# GitHub Release, it runs a handful of times a month, and a release should
# not depend on one person's spare machine being awake.

# Every job carries a timeout-minutes about 2.5x its measured average. The
# default is 360 minutes, and this workflow waits on things that have no upper
# bound of their own -- compose --wait, kubectl --wait=true, and the two until
# loops in scripts/backup.sh. On a private repository one such hang costs 360
# billable minutes, an eighth of the monthly allowance, for a run that was
# never going to finish.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # helm is not a Go module, so its pin lives here; kind's is on the helm job
  HELM_VERSION: v3.16.4
  # docker/build-push-action@v6 writes a job summary and uploads a
  # .dockerbuild record as an artifact for every build it runs. Nothing in
  # this repository reads either, and the artifacts inherit the repository's
  # 90-day retention.
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # lint, unit and fast-checks used to be three jobs, and fast-checks was
  # itself three (gen-check, compose-config, contracts). They keep collapsing
  # for one reason: GitHub bills the sum of the jobs, each rounded up to a
  # whole minute, so three jobs that install the same Go toolchain pay for it
  # three times. Measured setup share was 71% of fast-checks, 25% of lint and
  # 16% of unit -- 12.1 billable minutes for about 8 minutes of work.
  #
  # Two things are given up, both deliberately:
  #
  #   - The summary line says `checks` rather than which of the three failed.
  #     GitHub still names the failing step, so what is lost is the name on
  #     one line.
  #   - The steps are sequential, so a lint failure stops the run before the
  #     unit tests and you learn about the second failure on the next push.
  #     That is the trade: failed runs were 28% of the bill, and the steps are
  #     ordered cheapest-and-likeliest-to-fail first so a failure costs least.
  #
  # For the same reason foundry, node, helm and kubeconform are installed
  # immediately before the steps that need them rather than all at the top: a
  # failure in `make lint` should not have paid for a Solidity toolchain.
  checks:
    name: checks
    timeout-minutes: 30
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Not run on a merge to main -- see "what a merge to main runs" at the
    # top of this file. Tags still run everything.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # make lint runs gitleaks over the whole history, so a shallow
          # checkout would silently scan almost nothing.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          # A self-hosted runner keeps ~/go/pkg/mod and ~/.cache/go-build on
          # its own disk between jobs, so uploading them to GitHub's cache
          # buys nothing and costs a minute of wall time per job. On a hosted
          # runner the VM is new every time and the cache is the only thing
          # standing between this job and a cold module download.
          cache: ${{ vars.CI_RUNNER == '' }}

      # --- the cheap checks first: a failure here costs seconds, not minutes

      - name: go vet + golangci-lint + gitleaks
        run: make lint
      - name: go.mod / go.sum are tidy
        run: |
          make tidy
          git diff --exit-code -- go.mod go.sum tools/go.mod tools/go.sum
      - name: dev scripts parse
        # e2e.sh is checked here rather than only by the e2e job: this takes
        # milliseconds, and a syntax error found twelve minutes into a
        # container run is twelve minutes wasted.
        run: |
          for f in scripts/gen-dev-secrets.sh scripts/e2e.sh scripts/e2e-web.sh scripts/kind-secrets.sh scripts/helm-e2e.sh scripts/backup.sh scripts/restore-drill.sh scripts/gen-prod-secrets.sh deploy/vm/bootstrap.sh; do
            bash -n "$f"
          done
      - name: generated code is in sync (oapi-codegen, sqlc)
        run: make gen-check
      - name: sqlc vet
        run: go tool -modfile=tools/go.mod sqlc vet -f sqlc.yaml
      - name: compose file renders with every profile
        run: make compose-config
      # Every Fuzz* target must be one the fuzz-smoke job actually runs. That
      # job names ./internal/matching directly instead of asking `go test
      # -list` across all 43 packages, which cost four billable minutes to
      # find one target; this line is what stops a new target being forgotten.
      - name: every fuzz target lives in internal/matching
        run: |
          found=$(grep -rl '^func Fuzz' --include='*_test.go' . | sed 's|^\./||' | sort)
          expected="internal/matching/fuzz_test.go"
          test "$found" = "$expected" || {
            echo "fuzz targets moved or multiplied:"
            echo "$found"
            echo "update the test-fuzz target in the Makefile and this assertion"
            exit 1
          }

      # --- the Go test suite

      # deploy/helm/helm_test.go lints and renders the chart; with CI set it
      # fails rather than skips when either binary is missing
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform (pinned in tools/go.mod)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install -modfile=tools/go.mod github.com/yannh/kubeconform/cmd/kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: unit + property tests (-race)
        run: make test
      - name: coverage gate (internal/money >= 95%)
        run: make cover-money
      - name: matching property tests at full strength (>= 1,000 sequences each; -short runs 200)
        run: go test -race -count=1 -run 'TestProperty' ./internal/matching/
      - name: exchange / exchangectl smoke
        run: |
          make build
          bin/exchange version
          bin/exchangectl version
          # the seed import is implemented now; without a mnemonic it must fail
          # cleanly (exit 1) rather than panic or silently write a keystore
          bin/exchange keys import-mnemonic --from /dev/null --keystore-dir "$RUNNER_TEMP/ks" && exit 1 || test $? -eq 1
          test ! -e "$RUNNER_TEMP/ks/hd-seed.json"

      # --- the two toolchains nothing above needs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # see the note on setup-go above
          cache: ${{ vars.CI_RUNNER == '' && 'npm' || '' }}
          cache-dependency-path: web/trade/package-lock.json
      # the committed TypeScript client must match the OpenAPI document, and
      # the SPA must type-check and build; the browser smoke runs in e2e.
      # This step used to set PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD, which did
      # nothing: @playwright/test has no npm install script (package-lock.json
      # is v3 and marks only fsevents with hasInstallScript), so `npm ci` was
      # never going to fetch a browser here in the first place.
      - name: web/trade — schema.d.ts fresh, tsc, vite build
        run: make web-check
      - name: read pinned foundry version
        id: foundry
        run: echo "tag=$(sed -n 's/^FOUNDRY_TAG=//p' .env.example)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        if: ${{ vars.CI_RUNNER == '' }}
        with:
          version: ${{ steps.foundry.outputs.tag }}
      # A machine that already carries the pinned toolchain is not asked to
      # fetch it again. foundryup verifies every download against a GitHub
      # artifact attestation, and on 2026-09-10 that endpoint answered 500 for
      # a quarter of an hour and took down every job that needs forge -- on
      # branches whose diff contains no Solidity at all. The install is the
      # only thing in either job that reaches outside for a toolchain, so it is
      # the only thing that outage could reach. Installed once at setup, like
      # Playwright's system libraries and for the same reason
      # (docs/guides/self-hosted-runner.md).
      #
      # The pin is not lost, it moves: the installer enforced it before, the
      # assertion below enforces it now, and it fails loudly with the command
      # to run rather than quietly building against whatever is on the disk.
      - name: foundry is already on this machine
        if: ${{ vars.CI_RUNNER != '' }}
        run: |
          bin="$HOME/.foundry/bin"
          tag='${{ steps.foundry.outputs.tag }}'
          want="${tag#v}"
          if [ ! -x "$bin/forge" ]; then
            echo "no forge at $bin. This runner needs the toolchain installed once:"
            echo "    foundryup --install $tag"
            exit 1
          fi
          # || true so a forge that runs but exits non-zero reaches the case
          # below and prints what it said, rather than dying under `bash -e`
          # with its output swallowed by the substitution.
          have=$("$bin/forge" --version 2>&1 || true)
          printf '%s\n' "$have"
          case "$have" in
            *"$want"[!0-9]*|*"$want") ;;
            *)
              echo "forge on this runner is not the pinned $tag. Reinstall it:"
              echo "    foundryup --install $tag"
              exit 1
              ;;
          esac
          echo "$bin" >> "$GITHUB_PATH"
      # working-directory is per-step, not a job default: a job-level default
      # would send make gen-check and make compose-config into infra/contracts.
      - name: forge build
        working-directory: infra/contracts
        run: forge build --sizes
      - name: forge test
        working-directory: infra/contracts
        run: forge test -vv

  # Four billable minutes used to go here for one fuzz target -- FuzzApply in
  # internal/matching is the only one in the repository, and `go test -list`
  # across all 43 packages had to link a test binary per package to find it.
  # The Makefile now names the package; the checks job asserts no other Fuzz*
  # target exists, so forgetting one is a red check rather than silence.
  #
  # push covers both `branches: [main]` and `tags: ["v*"]`, so every merge and
  # every release still fuzzes it; what a pull request gives up is 30 seconds
  # of fuzzing on a single target, for the hours between opening and merging.
  #
  # docs/plan-v1.0.md §13.3 requires every Fuzz* for 30s with failing corpora
  # committed to testdata/fuzz. That is about strength and what to do with a
  # failure, not about which events run it.
  fuzz-smoke:
    name: fuzz-smoke
    timeout-minutes: 20
    needs: [checks]
    # checks is skipped on a merge to main, and a skipped dependency would
    # otherwise skip this too -- which is the one job the merge exists for.
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          cache: ${{ vars.CI_RUNNER == '' }}
      - name: FuzzApply for 30s (docs/plan-v1.0.md §13.3)
        run: make test-fuzz FUZZ_TIME=30s

  integration:
    name: integration
    timeout-minutes: 30
    needs: [checks]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Not run on a merge to main -- see "what a merge to main runs" at the
    # top of this file. Tags still run everything.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          # see the note on the checks job: a self-hosted runner already has
          # the module and build caches on its own disk
          cache: ${{ vars.CI_RUNNER == '' }}
      - name: testcontainers (postgres, nats) — migrate, seed, registry API, ledger, admin API, trading engine, outbox relay
        env:
          CI: "true" # a missing Docker daemon fails instead of skipping
        run: make test-integration
      # a self-hosted runner keeps everything this job built; see the action
      - name: reclaim disk
        if: ${{ always() && vars.CI_RUNNER != '' }}
        uses: ./.github/actions/reclaim-disk

  e2e:
    name: e2e
    timeout-minutes: 25
    needs: [integration]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Not run on a merge to main -- see "what a merge to main runs" at the
    # top of this file. Tags still run everything.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    steps:
      # buildx keeps its instances -- and the pointer to the selected one -- in
      # $BUILDX_CONFIG, which defaults to ~/.docker/buildx. The two self-hosted
      # runners are two processes under one user on one machine, so that
      # default is a single shared directory, and this stage deliberately runs
      # e2e, helm and image at once. This job has no setup-buildx-action of its
      # own, so `compose up --build` uses whichever builder is selected: on run
      # 34448309366 helm selected one, this job inherited it, and helm's post
      # step removed it mid-build -- "dial unix /run/buildkit/buildkitd.sock:
      # no such file or directory", 24 build steps in. RUNNER_TEMP is per
      # runner process and jobs on one runner are sequential, which is exactly
      # the scope this state needs. With nothing defined in it, buildx falls
      # back to `default`, the daemon's own builder, which no job creates or
      # removes.
      - name: this job gets its own buildx state
        run: |
          mkdir -p "$RUNNER_TEMP/buildx"
          echo "BUILDX_CONFIG=$RUNNER_TEMP/buildx" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          # see the note on the checks job: a self-hosted runner already has
          # the module and build caches on its own disk
          cache: ${{ vars.CI_RUNNER == '' }}
      # api, engine and admin run as separate containers, so every order has
      # to travel over the NATS command bus to reach the engine. This is the
      # only job that exercises the split deployment (docs/plan-v1.0.md §13.3).
      - name: compose app profile — exchangectl e2e, engine kill -9, market halt
        env:
          KEEP: "1" # tear down in the step below, so the logs survive a failure
        run: make e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # see the note on the checks job
          cache: ${{ vars.CI_RUNNER == '' && 'npm' || '' }}
          cache-dependency-path: web/trade/package-lock.json
      # the stack from `make e2e` is still up (KEEP=1): register in the
      # browser, fund through the admin faucet, trade, watch both streams
      - name: web/trade — Playwright smoke against the compose stack
        env:
          # Two different things hide inside `playwright install --with-deps`,
          # and only one of them is a problem on a self-hosted runner:
          #
          #   the browser binary   no privileges, no distro dependency, and a
          #                        no-op once ~/.cache/ms-playwright has it
          #   --with-deps          shells out to `sudo -- sh -c "apt-get ..."`,
          #                        and only knows the Ubuntu releases Playwright
          #                        ships a package list for
          #
          # On a GitHub-hosted runner both are free: the VM is root-capable and
          # discarded afterwards. On somebody's actual computer the second one
          # would mean granting the runner's account passwordless sudo, so the
          # machine installs those libraries once at setup
          # (docs/guides/self-hosted-runner.md) and CI asks for the browser
          # alone. Asking for the browser every run rather than skipping the
          # step entirely is deliberate: a runner whose cache was wiped heals
          # itself instead of going red.
          PLAYWRIGHT_INSTALL_DEPS: ${{ vars.CI_RUNNER == '' && '1' || '0' }}
        run: make web-e2e
      # the stack is still up: back it up into the compose MinIO, restore the
      # dump into a throwaway database, check it, and print the RTO
      # (docs/runbooks/backup-restore.md)
      # shell: bash makes the step's shell `bash -eo pipefail`, so a failed
      # drill fails the step instead of tee's exit status hiding it
      - name: backup and restore drill
        shell: bash
        run: make backup-drill 2>&1 | tee backup-drill.log
      # Every artifact here is for reading a failure. The repository default
      # retention is 90 days, and the drill log used to upload on success too,
      # where the RTO it reports is already in the step output above.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backup-drill-log
          path: backup-drill.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: |
            web/trade/playwright-report
            web/trade/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: collect container logs
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env --profile infra --profile app --profile backup logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: tear down
        if: always()
        run: docker compose -f deploy/compose/compose.yaml --env-file .env --profile infra --profile app --profile backup down -v --remove-orphans || true
      # a self-hosted runner keeps everything this job built; see the action
      - name: reclaim disk
        if: ${{ always() && vars.CI_RUNNER != '' }}
        uses: ./.github/actions/reclaim-disk

  helm:
    name: helm
    timeout-minutes: 25
    needs: [integration]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Not run on a merge to main -- see "what a merge to main runs" at the
    # top of this file. Tags still run everything.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    env:
      KIND_CLUSTER: exchange
    steps:
      # Its own buildx state, so `--use` here and the post step's `buildx rm`
      # cannot reach into a concurrent job. See the e2e job for the incident.
      - name: this job gets its own buildx state
        run: |
          mkdir -p "$RUNNER_TEMP/buildx"
          echo "BUILDX_CONFIG=$RUNNER_TEMP/buildx" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          # see the note on the checks job: a self-hosted runner already has
          # the module and build caches on its own disk
          cache: ${{ vars.CI_RUNNER == '' }}
      - name: read pinned foundry version
        id: foundry
        run: echo "tag=$(sed -n 's/^FOUNDRY_TAG=//p' .env.example)" >> "$GITHUB_OUTPUT"
      # kind-secrets.sh derives the throwaway hot wallet with cast
      - uses: foundry-rs/foundry-toolchain@v1
        if: ${{ vars.CI_RUNNER == '' }}
        with:
          version: ${{ steps.foundry.outputs.tag }}
      # A machine that already carries the pinned toolchain is not asked to
      # fetch it again. foundryup verifies every download against a GitHub
      # artifact attestation, and on 2026-09-10 that endpoint answered 500 for
      # a quarter of an hour and took down every job that needs forge -- on
      # branches whose diff contains no Solidity at all. The install is the
      # only thing in either job that reaches outside for a toolchain, so it is
      # the only thing that outage could reach. Installed once at setup, like
      # Playwright's system libraries and for the same reason
      # (docs/guides/self-hosted-runner.md).
      #
      # The pin is not lost, it moves: the installer enforced it before, the
      # assertion below enforces it now, and it fails loudly with the command
      # to run rather than quietly building against whatever is on the disk.
      - name: foundry is already on this machine
        if: ${{ vars.CI_RUNNER != '' }}
        run: |
          bin="$HOME/.foundry/bin"
          tag='${{ steps.foundry.outputs.tag }}'
          want="${tag#v}"
          if [ ! -x "$bin/forge" ]; then
            echo "no forge at $bin. This runner needs the toolchain installed once:"
            echo "    foundryup --install $tag"
            exit 1
          fi
          # || true so a forge that runs but exits non-zero reaches the case
          # below and prints what it said, rather than dying under `bash -e`
          # with its output swallowed by the substitution.
          have=$("$bin/forge" --version 2>&1 || true)
          printf '%s\n' "$have"
          case "$have" in
            *"$want"[!0-9]*|*"$want") ;;
            *)
              echo "forge on this runner is not the pinned $tag. Reinstall it:"
              echo "    foundryup --install $tag"
              exit 1
              ;;
          esac
          echo "$bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # A release must report its tag; anything else runs as the chart's own
      # appVersion. helm-e2e.sh checks the running binary against both.
      - name: app version under test
        id: appv
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="$GITHUB_REF_NAME"
          else
            v="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/exchange/Chart.yaml)"
          fi
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          load: true
          # NOT crypto-exchange:ci. The image job builds that same tag, into
          # this same daemon, at this same time, with VERSION=dev -- while this
          # job needs the chart's appVersion baked in. Whichever `--load`
          # landed last owned the tag, and helm-e2e.sh's version assertion
          # only passed when this one did. The image job's smoke never noticed
          # it could be running this job's binary, because it does not assert
          # the version it prints.
          tags: crypto-exchange:ci-helm
          build-args: |
            VERSION=${{ steps.appv.outputs.version }}
            # Fixed on a pull request. These are baked into the binary's
            # ldflags, so the real commit and timestamp change the hash of the
            # final `go build` layer on every single commit -- which is every
            # layer cache in this workflow missing, always, by construction.
            # A pull request image is never published, so the only thing the
            # real values buy there is a cache that can never hit.
            COMMIT=${{ github.event_name == 'push' && github.sha || 'dev' }}
            DATE=${{ github.event_name == 'push' && github.event.head_commit.timestamp || '1970-01-01T00:00:00Z' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          node_image: kindest/node:v1.31.6
          cluster_name: ${{ env.KIND_CLUSTER }}
      - name: load the image into the cluster
        run: kind load docker-image crypto-exchange:ci-helm --name "$KIND_CLUSTER"
      # the JWT key and the keystore are generated with the binary itself
      - name: build exchange
        run: make build
      - name: create the secrets the chart expects
        run: scripts/kind-secrets.sh exchange
      # install with --wait, exchangectl e2e from inside the cluster, delete
      # the engine pod and compare the book, and check that the running
      # binary reports the chart's appVersion (docs/plan-v1.0.md §12 Phase 7)
      - name: install the chart and run the in-cluster e2e
        env:
          APP_VERSION: ${{ steps.appv.outputs.version }}
          # helm-e2e.sh defaults to `ci`, which is right for `make kind-e2e` on
          # a laptop where nothing else is building. In this workflow it has to
          # match the tag above.
          IMAGE_TAG: ci-helm
        run: scripts/helm-e2e.sh
      - name: collect cluster state
        if: always()
        run: |
          mkdir -p kind-logs
          kubectl get all,jobs,configmaps,pdb,networkpolicies -o wide > kind-logs/resources.txt 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp > kind-logs/events.txt 2>&1 || true
          kubectl describe pods > kind-logs/describe-pods.txt 2>&1 || true
          kubectl describe jobs > kind-logs/describe-jobs.txt 2>&1 || true
          for p in $(kubectl get pods -o name); do
            kubectl logs "$p" --all-containers --prefix > "kind-logs/${p#pod/}.log" 2>&1 || true
            kubectl logs "$p" --all-containers --prefix --previous > "kind-logs/${p#pod/}.previous.log" 2>/dev/null || true
          done
          helm get manifest exchange > kind-logs/manifest.yaml 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: helm-kind-logs
          path: kind-logs
          retention-days: 7
          if-no-files-found: ignore
      - name: delete the cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER" || true
      # a self-hosted runner keeps everything this job built; see the action
      - name: reclaim disk
        if: ${{ always() && vars.CI_RUNNER != '' }}
        uses: ./.github/actions/reclaim-disk

  image:
    name: image
    timeout-minutes: 20
    needs: [integration]
    # Runs when integration passed, and when it was skipped because this is
    # a merge to main. A real integration failure still stops it, and
    # !cancelled() rather than always() so a cancelled run cannot publish.
    if: ${{ !cancelled() && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    # This job spent 2026-09-09 pinned to ubuntu-latest on push events,
    # because the metadata step below could not reach api.github.com from the
    # self-hosted runner. The cause was DNS, not the network: one name's AAAA
    # query went unanswered and the resolver spent 17 seconds giving up. Fixed
    # on the machine, so this is back to the ordinary switch. ADR-0012
    # decision 1 has the elimination chain.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      # Its own buildx state, so `--use` here and the post step's `buildx rm`
      # cannot reach into a concurrent job. See the e2e job for the incident.
      - name: this job gets its own buildx state
        run: |
          mkdir -p "$RUNNER_TEMP/buildx"
          echo "BUILDX_CONFIG=$RUNNER_TEMP/buildx" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: image metadata
        id: meta
        # Only the push steps below read these outputs, and every one of them
        # is push-only. On a pull request the action still calls the GitHub API
        # for the repository description and licence that go into the OCI
        # labels -- three calls whose results nothing reads, and each one a way
        # for the job to fail before it has built anything. Run 98's image job
        # died exactly there, on `Connect Timeout Error`, with checkout and
        # buildx fine either side of it.
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: crypto-exchange:ci
          build-args: |
            # github.ref_name on a pull request is "<number>/merge", so it
            # differed per pull request and no two branches could share a
            # layer. Nothing published comes out of a pull request build.
            VERSION=${{ github.event_name == 'push' && github.ref_name || 'dev' }}
            # see the note in the helm job: real metadata on a push, fixed on
            # a pull request so the layer cache has something to hit
            COMMIT=${{ github.event_name == 'push' && github.sha || 'dev' }}
            DATE=${{ github.event_name == 'push' && github.event.head_commit.timestamp || '1970-01-01T00:00:00Z' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image smoke
        run: |
          docker run --rm crypto-exchange:ci version
          docker run --rm --entrypoint /exchangectl crypto-exchange:ci version
      # The two images the production overlay adds (deploy/compose/compose.prod.yaml):
      # Caddy with the built front end, and the backup sidecar. Same tags,
      # their own cache scopes.
      - name: edge image metadata
        id: meta-edge
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-edge
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: build the edge image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/edge/Dockerfile
          load: true
          tags: crypto-exchange-edge:ci
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
      - name: edge image smoke
        run: |
          docker run --rm crypto-exchange-edge:ci caddy version
          docker run --rm crypto-exchange-edge:ci caddy validate --config /etc/caddy/Caddyfile
          docker run --rm crypto-exchange-edge:ci caddy validate --config /etc/caddy/Caddyfile.dev
          docker run --rm --entrypoint sh crypto-exchange-edge:ci -c 'test -s /srv/index.html && ls /srv/assets | grep -q "\.js$"'
      - name: backup image metadata
        id: meta-backup
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backup
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: build the backup image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/backup/Dockerfile
          load: true
          tags: crypto-exchange-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
      - name: backup image smoke
        run: |
          docker run --rm --entrypoint mc crypto-exchange-backup:ci --version
          docker run --rm --entrypoint pg_dump crypto-exchange-backup:ci --version
          docker run --rm --entrypoint bash crypto-exchange-backup:ci -n /usr/local/bin/backup.sh
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
      - name: push the edge image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/edge/Dockerfile
          push: true
          tags: ${{ steps.meta-edge.outputs.tags }}
          labels: ${{ steps.meta-edge.outputs.labels }}
          cache-from: type=gha,scope=edge
      - name: push the backup image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/backup/Dockerfile
          push: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha,scope=backup
      # a self-hosted runner keeps everything this job built; see the action
      - name: reclaim disk
        if: ${{ always() && vars.CI_RUNNER != '' }}
        uses: ./.github/actions/reclaim-disk

  # A v* tag is a release (docs/release.md): the images are already on ghcr
  # (image pushes on every push event, a tag included), the chart has run on
  # kind and the compose e2e passed. What is left is to publish the chart,
  # prove the running binary and the chart agree on the version, and open
  # the GitHub Release with the chart and the exchangectl binaries attached.
  release:
    name: release
    timeout-minutes: 20
    needs: [image, helm, e2e]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
          # see the note on the checks job: a self-hosted runner already has
          # the module and build caches on its own disk
          cache: ${{ vars.CI_RUNNER == '' }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: versions
        id: v
        run: |
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docs/plan-v1.0.md §12 Phase 7 DoD: the image that was pushed reports
      # the tag, and so will the chart
      - name: the released image reports the tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          docker pull --quiet "$IMAGE"
          got="$(docker run --rm "$IMAGE" version --json | jq -r .version)"
          test "$got" = "$TAG" || { echo "image reports $got, tag is $TAG"; exit 1; }
          for extra in edge backup; do docker manifest inspect "ghcr.io/${{ github.repository }}-$extra:${{ steps.v.outputs.version }}" >/dev/null; done
      - name: package the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          helm package deploy/helm/exchange --version "$VERSION" --app-version "$TAG" --destination dist
          got="$(helm show chart "dist/exchange-$VERSION.tgz" | sed -n 's/^appVersion: *//p')"
          test "$got" = "$TAG" || { echo "chart appVersion is $got, tag is $TAG"; exit 1; }
      - name: push the chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/exchange-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: build exchangectl for the release
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          for target in linux/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG -X main.commit=$GITHUB_SHA -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/exchangectl-${target%/*}-${target#*/}" ./cmd/exchangectl
          done
          (cd dist && sha256sum exchange-*.tgz exchangectl-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/exchange-*.tgz
            dist/exchangectl-*
            dist/SHA256SUMS
