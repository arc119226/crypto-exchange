# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (CONTRIBUTING.md). This project takes DCO rather than a CLA, so this
# job is the entire enforcement mechanism -- there is nothing to sign and no
# database of signatures, only this line in the commit message.
#
# Written out rather than using a third-party GitHub App: it is twenty lines,
# and a one-person project is better off with one fewer external dependency
# that can change hands or start asking for permissions.
name: dco

on:
  pull_request:

# Read-only, and it stays that way: this runs on code from forks.
permissions:
  contents: read

jobs:
  dco:
    name: commits are signed off
    # Pinned to a hosted runner rather than vars.CI_RUNNER on purpose. It reads
    # git and nothing else, it runs on every pull request including from forks,
    # and a self-hosted runner should not be executing fork branches at all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --no-merges: a merge commit is generated by GitHub or by `git merge`
          # and has no author to certify anything.
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! git log -1 --format='%B' "$sha" |
                 grep -qE '^[[:space:]]*[Ss]igned-off-by:[[:space:]]*.+[[:space:]]+<[^>]+>[[:space:]]*$'; then
              echo "::error::$sha has no Signed-off-by line: $(git log -1 --format='%s' "$sha")"
              missing=$((missing + 1))
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")

          if [ "$missing" -gt 0 ]; then
            {
              echo
              echo "$missing commit(s) above are missing a Developer Certificate of"
              echo "Origin sign-off. There is nothing to sign and nobody to email --"
              echo "the line itself is the statement that you have the right to"
              echo "contribute the code under Apache-2.0."
              echo "https://developercertificate.org/"
              echo
              echo "  Fix the last commit:    git commit -s --amend"
              echo "  Fix every commit here:  git rebase --signoff origin/main"
              echo "  Then:                   git push --force-with-lease"
              echo
              echo "Going forward, 'git commit -s' adds it for you."
            } >&2
            exit 1
          fi
          echo "all commits signed off"
