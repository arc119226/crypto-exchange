openapi: 3.0.3
info:
  title: Exchange Public API
  version: 1.0.0-phase6
  description: |
    Public REST API of the white-label exchange engine (docs/plan-v1.0.md §7.4).

    Conventions
    - Every monetary value is a decimal **string** (`Amount`); JSON numbers are
      rejected. Precision per asset is given by `Asset.scale`.
    - Errors are RFC 7807 `application/problem+json` documents and carry the
      request's `correlation_id`.
    - Clients may send `X-Request-Id`; the server echoes it (or generates one)
      and uses it as the correlation id in logs and problem responses.
    - Additive changes never bump the version; breaking changes go to `/v2`.

    Authentication (ADR-0006)
    - **Sessions**: `POST /v1/auth/register` or `/v1/auth/login` return an
      Ed25519-signed JWT access token (15 min, `Authorization: Bearer …`) and
      an opaque refresh token (7 days, single use: `/v1/auth/refresh` rotates
      it). Public keys are served at `/.well-known/jwks.json`.
    - **API keys** (programmatic trading): send `X-API-KEY` (the key id),
      `X-API-TIMESTAMP` (unix milliseconds, within ±30 s of server time) and
      `X-API-SIGNATURE` = hex(HMAC-SHA256(secret, canonical)) where canonical
      is `timestamp + "\n" + METHOD + "\n" + request URI (path and query) +
      "\n" + raw body`. Keys carry scopes: `read` for GET endpoints, `trade`
      for orders, `withdraw` for withdrawals (Phase 4).
    - Rate limits (`429`, `Retry-After`): login 10/min per IP and 5/min per
      account; orders and cancels 20/s per account.
  contact:
    name: crypto-exchange
    url: https://github.com/arc119226/crypto-exchange
servers:
  - url: http://localhost:8080
    description: Local development (`make up-single`)
tags:
  - name: auth
    description: Sessions and JWKS (reference implementation, replaceable by a customer IdP)
  - name: api-keys
    description: HMAC API keys for programmatic access
  - name: account
    description: The caller's account, balances and ledger entries
  - name: registry
    description: Listed assets and markets (read-only; edited via the admin API)
  - name: trading
    description: Orders and fills (one spot account per user)
  - name: market-data
    description: Public order book and trade history

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a user and open a spot account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered; a session is returned so the client can start immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      description: The presented refresh token is revoked and a new pair is issued. Presenting an already-rotated token revokes every session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      description: Idempotent; unknown tokens are ignored. Access tokens stay valid until they expire (15 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Revoked (or already unknown)
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /.well-known/jwks.json:
    get:
      tags: [auth]
      operationId: getJWKS
      summary: Public keys that verify access tokens
      responses:
        "200":
          description: JSON Web Key Set (RFC 7517)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/api-keys:
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List the caller's API keys
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Keys (secrets are never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key
      description: Requires a session (JWT); API keys cannot mint API keys. The secret is returned once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Created; store the secret now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/api-keys/{id}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The caller's user and spot account
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/balances:
    get:
      tags: [account]
      operationId: listBalances
      summary: Balances of the caller's spot account
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: One entry per asset ever touched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/ledger/entries:
    get:
      tags: [account]
      operationId: listLedgerEntries
      summary: Journal entries that touched the caller's account
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Entries, newest first, with the caller's postings only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/deposit-address:
    get:
      tags: [account]
      operationId: getDepositAddress
      summary: The caller's deposit address for an asset
      description: >
        Returns the address to send deposits to. One address per account per
        chain: every asset on the same chain, native and ERC-20 alike, shares
        it, and repeated calls return the same address. Addresses are
        pre-generated, so a 503 means the pool is momentarily empty and the
        call should be retried.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: asset
          in: query
          required: true
          description: Asset symbol, used to pick the chain and to check deposits are open.
          schema: { type: string, example: ETH }
      responses:
        "200":
          description: The caller's deposit address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/deposits:
    get:
      tags: [account]
      operationId: listDeposits
      summary: The caller's deposits, newest first
      description: >
        A deposit is only money once its status is `credited`. `detected` and
        `confirming` mean it has been seen on chain but not yet posted;
        `orphaned` means the block carrying it was reorged away and it may
        still come back; `dropped` means it did not.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/withdrawals:
    get:
      tags: [account]
      operationId: listWithdrawals
      summary: The caller's withdrawals, newest first
      description: >
        A withdrawal's `status` follows docs/plan-v1.0.md §6.4.2.
        `requested` has only been recorded; `pending_review` is waiting for an
        administrator; `auto_approved` and `approved` are cleared but not yet
        funded; `funds_locked` means the amount is held and the withdrawal is
        queued for signing. `rejected` and `failed` are terminal, and the funds
        were never or no longer held.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [account]
      operationId: createWithdrawal
      summary: Request a withdrawal
      description: |
        Records a withdrawal request. Nothing is held and nothing is signed
        here: the chain role applies the withdrawal policy next, and either
        clears it automatically or queues it for an administrator.

        `Idempotency-Key` is required and scoped to the account. Resending the
        same request with the same key returns the original withdrawal with
        **200**; reusing the key with a different asset, amount or destination
        is **422**. The key never expires — there is no window after which the
        same key would create a second withdrawal.

        `to_address` may be given in any casing, but a mixed-case address must
        pass its EIP-55 checksum: that casing *is* a checksum, and accepting a
        wrong one would send funds to a mistyped address.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-chosen key, unique per request within the account.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalRequest"
      responses:
        "200":
          description: The withdrawal this Idempotency-Key already created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "201":
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/assets:
    get:
      tags: [registry]
      operationId: listAssets
      summary: List assets
      description: Returns every listed asset, ordered by symbol.
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets:
    get:
      tags: [registry]
      operationId: listMarkets
      summary: List markets
      description: Returns every market that is not delisted, ordered by symbol.
      responses:
        "200":
          description: Market list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{symbol}:
    get:
      tags: [registry]
      operationId: getMarket
      summary: Get one market by symbol
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{symbol}/depth:
    get:
      tags: [market-data]
      operationId: getDepth
      summary: Aggregated order book
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
        - name: limit
          in: query
          description: Levels per side (default 20, max 200)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Depth snapshot with the engine sequence it reflects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Depth"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{symbol}/trades:
    get:
      tags: [market-data]
      operationId: listTrades
      summary: Recent public trades
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Trades, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeList"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{symbol}/ticker:
    get:
      tags: [market-data]
      operationId: getTicker
      summary: 24-hour ticker
      description: |
        Rolling 24-hour summary folded from the market's 1-minute candles:
        last price, the open 24 hours ago, high, low, base and quote volume,
        trade count and the change. The price fields are omitted when the
        window holds no trade. Served from persisted candles, so it lags the last
        trade by up to the worker's poll interval (about a second).
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
      responses:
        "200":
          description: Ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticker"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{symbol}/klines:
    get:
      tags: [market-data]
      operationId: listKlines
      summary: Candles (OHLCV)
      description: |
        One candle per bucket of `[from, to)`, oldest first, gaps filled with
        flat candles that carry the previous close (`trades` is `0` on those).
        Buckets are aligned to UTC; a day starts at 00:00 UTC. `to` defaults
        to now and `from` to `to − limit × interval`; a range wider than
        `limit` buckets is cut at `limit` from `from`.
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
        - name: interval
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/KlineInterval"
        - name: from
          in: query
          description: Start of the range (inclusive), aligned down to a bucket
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of the range (exclusive); default now
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum candles returned (default 500, max 1000)
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Candles, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders:
    post:
      tags: [trading]
      operationId: placeOrder
      summary: Place an order
      description: |
        Limit orders carry `price` and `qty`; market sells carry `qty`; market
        buys carry `quote_qty` (the quote budget). The response is the order in
        its state right after the command with the trades it produced as
        taker. Business rejections (tick, step, min notional, balance, market
        status) are **201 with `status: rejected`**, not errors.

        `client_order_id` is idempotent per account: resending the same
        request returns the original order with **200**; reusing the id with
        a different request is **422**.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order accepted or rejected by the engine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "200":
          description: Replay of an earlier request with the same `client_order_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [trading]
      operationId: listOrders
      summary: List the caller's orders
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: market
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: open_only
          in: query
          description: Only `open` and `partially_filled` orders
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/orders/{id}:
    get:
      tags: [trading]
      operationId: getOrder
      summary: Get one of the caller's orders with its trades
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order and its trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [trading]
      operationId: cancelOrder
      summary: Cancel an order
      description: Idempotent — a terminal order is returned as it is. The response is the order after the cancel.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order after the cancel (or its terminal state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/fills:
    get:
      tags: [trading]
      operationId: listFills
      summary: The caller's fills (its side of each trade)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: market
          in: query
          schema:
            type: string
        - name: order_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Fills, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/v1/auth/login`; Ed25519 (EdDSA), 15 minutes.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key id; the request must also carry `X-API-TIMESTAMP` and `X-API-SIGNATURE` (see the introduction).

  parameters:
    MarketSymbol:
      name: symbol
      in: path
      required: true
      description: Market symbol in `BASE-QUOTE` form, e.g. `ETH-USDC`. Case-sensitive.
      schema:
        type: string
        pattern: '^[A-Z0-9]{2,16}-[A-Z0-9]{2,16}$'
        example: ETH-USDC
    OrderID:
      name: id
      in: path
      required: true
      description: Order id (ULID)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (default 100, max 500)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0

  responses:
    BadRequest:
      description: Malformed request (shape, missing fields, invalid amounts)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The credential lacks the scope, or the key is not allowed from this address
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The email is already registered
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is well-formed but violates a rule (weak password, `client_order_id` reused with different content)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded; retry after `Retry-After` seconds
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until a token is available
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The trading engine is not reachable or not ready; retry with the same `client_order_id`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error; retry with the same `X-Request-Id` and quote the `correlation_id` when reporting
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Amount:
      type: string
      description: |
        Arbitrary-precision decimal serialized as a string, at most 18 integer
        and 18 fractional digits (Postgres NUMERIC(36,18)). Never a JSON number.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: "1990.00"
      x-go-type: money.Amount
      x-go-type-import:
        path: github.com/arc119226/crypto-exchange/internal/money

    # --- auth ---

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Session:
      type: object
      required: [user_id, account_id, role, access_token, token_type, expires_in, expires_at, refresh_token]
      properties:
        user_id:
          type: string
        account_id:
          type: string
          description: The spot account every trading call is keyed by
        role:
          type: string
          enum: [user, admin]
        access_token:
          type: string
          description: "JWT, send as `Authorization: Bearer <access_token>`"
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Opaque, single use; rotate with `/v1/auth/refresh`

    JWKS:
      type: object
      description: "RFC 7517 key set; keys are OKP/Ed25519 with `use: sig`"
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    # --- api keys ---

    Scope:
      type: string
      enum: [read, trade, withdraw]

    APIKey:
      type: object
      required: [id, key_id, label, scopes, ip_allowlist, created_at]
      properties:
        id:
          type: string
        key_id:
          type: string
          description: Public identifier sent in `X-API-KEY`
          example: ak_3f1c9a2b7d4e6f8a0b1c2d3e
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        ip_allowlist:
          type: array
          description: IPs or CIDRs the key may be used from; empty means any
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    APIKeyList:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"

    CreateAPIKeyRequest:
      type: object
      required: [scopes]
      properties:
        label:
          type: string
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        ip_allowlist:
          type: array
          items:
            type: string

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: HMAC secret, shown exactly once

    # --- account ---

    Account:
      type: object
      required: [user_id, account_id, email, role, kyc_level, status, created_at]
      properties:
        user_id:
          type: string
        account_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
        kyc_level:
          type: integer
          format: int32
          description: 0–2, written by the operator's systems through the admin API
        status:
          type: string
          enum: [active, frozen]
        created_at:
          type: string
          format: date-time

    Balance:
      type: object
      required: [asset, available, hold, total]
      properties:
        asset:
          type: string
        available:
          $ref: "#/components/schemas/Amount"
        hold:
          $ref: "#/components/schemas/Amount"
        total:
          $ref: "#/components/schemas/Amount"

    DepositAddress:
      type: object
      required: [asset, chain_id, address]
      properties:
        asset:
          type: string
          example: ETH
        chain_id:
          type: integer
          format: int64
          description: EVM chain the address lives on.
          example: 31337
        address:
          type: string
          description: EIP-55 checksummed address. Send only assets of this chain to it.
          pattern: '^0x[0-9a-fA-F]{40}$'
          example: "0x9858EfFD232B4033E47d90003D41EC34EcaEda94"

    Deposit:
      type: object
      required: [id, asset, amount, address, tx_hash, log_index, block_number, confirmations, required_confirmations, status, created_at]
      properties:
        id: { type: string }
        asset: { type: string, example: ETH }
        amount:
          $ref: "#/components/schemas/Amount"
        address:
          type: string
          description: >
            The deposit address the funds arrived at, lower-case. Note that
            this is *not* the form `GET /v1/deposit-address` returns: that one
            is EIP-55 checksummed so a wallet can catch a mistyped paste, while
            everything read back out of the chain tables is normalised. Compare
            the two only after deciding which representation you want.
        tx_hash: { type: string }
        log_index:
          type: integer
          format: int32
          description: ERC-20 log index, or -1 for a native transfer.
        block_number:
          type: integer
          format: int64
          description: Where it currently sits; a reorg can change this.
        confirmations: { type: integer, format: int32 }
        required_confirmations:
          type: integer
          format: int32
          description: What this asset needs before it is credited.
        status:
          type: string
          description: detected, confirming, credited, orphaned, dropped or reversed. Open for new states.
          example: credited
        credited_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }

    CreateWithdrawalRequest:
      type: object
      required: [asset, amount, to_address]
      properties:
        asset:
          type: string
          example: ETH
        amount:
          $ref: "#/components/schemas/Amount"
        to_address:
          type: string
          description: Destination address. Any casing; a mixed-case one must pass EIP-55.
          example: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"

    Withdrawal:
      type: object
      required: [id, asset, amount, to_address, chain_id, status, created_at]
      properties:
        id: { type: string }
        asset: { type: string, example: ETH }
        amount:
          $ref: "#/components/schemas/Amount"
        to_address:
          type: string
          description: The destination, lower-case.
        chain_id:
          type: integer
          format: int64
        status:
          type: string
          description: >
            requested, policy_check, auto_approved, pending_review, approved,
            funds_locked, signed, broadcast, confirmed, rejected or failed.
            Open for new states.
          example: pending_review
        tx_hash:
          type: string
          nullable: true
          description: >
            The on-chain transaction, once one exists. While a stuck
            withdrawal is being cancelled this is the displacing transaction,
            because that is the one whose fate decides the money.
        failure_reason:
          type: string
          nullable: true
          description: Why it failed; null unless the status is failed.
        review_note:
          type: string
          nullable: true
          description: What the administrator wrote when approving or rejecting.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WithdrawalList:
      type: object
      required: [withdrawals]
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"

    DepositList:
      type: object
      required: [deposits]
      properties:
        deposits:
          type: array
          items:
            $ref: "#/components/schemas/Deposit"

    BalanceList:
      type: object
      required: [balances]
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/Balance"

    Posting:
      type: object
      required: [asset, bucket, direction, amount]
      properties:
        asset:
          type: string
        bucket:
          type: string
          enum: [available, hold]
        direction:
          type: string
          enum: [debit, credit]
        amount:
          $ref: "#/components/schemas/Amount"

    LedgerEntry:
      type: object
      required: [id, kind, created_at, postings]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          description: hold | release | settle | credit | adjustment | …
        ref_type:
          type: string
          x-go-type-skip-optional-pointer: true
        ref_id:
          type: string
          x-go-type-skip-optional-pointer: true
        reason:
          type: string
          x-go-type-skip-optional-pointer: true
        created_at:
          type: string
          format: date-time
        postings:
          type: array
          description: Only the caller's own postings of the entry
          items:
            $ref: "#/components/schemas/Posting"

    LedgerEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"

    # --- registry ---

    AssetStatus:
      type: string
      description: "`disabled` assets are hidden from trading and deposits."
      enum: [active, disabled]

    Asset:
      type: object
      description: A currency the exchange lists.
      required:
        - symbol
        - name
        - chain_id
        - contract_address
        - is_native
        - scale
        - display_scale
        - required_confirmations
        - min_deposit
        - min_withdrawal
        - withdrawal_fee
        - deposit_enabled
        - withdraw_enabled
        - status
      properties:
        symbol:
          type: string
          example: USDC
        name:
          type: string
          example: USD Coin (mock)
        chain_id:
          type: integer
          format: int64
          description: EVM chain id the asset lives on (31337 = anvil, 11155111 = Sepolia).
          example: 31337
        contract_address:
          type: string
          nullable: true
          description: ERC-20 contract address; `null` for the chain's native coin.
          pattern: '^0x[0-9a-fA-F]{40}$'
          example: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
        is_native:
          type: boolean
        scale:
          type: integer
          format: int32
          description: Number of fractional digits carried internally (ETH 18, USDC 6).
          minimum: 0
          maximum: 18
        display_scale:
          type: integer
          format: int32
          description: Suggested number of fractional digits for display.
          minimum: 0
          maximum: 18
        required_confirmations:
          type: integer
          format: int32
          minimum: 1
        min_deposit:
          $ref: "#/components/schemas/Amount"
        min_withdrawal:
          $ref: "#/components/schemas/Amount"
        withdrawal_fee:
          $ref: "#/components/schemas/Amount"
        deposit_enabled:
          type: boolean
        withdraw_enabled:
          type: boolean
        status:
          $ref: "#/components/schemas/AssetStatus"

    AssetList:
      type: object
      required: [assets]
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/Asset"

    MarketStatus:
      type: string
      description: |
        - `active`: accepts orders and cancels
        - `halted`: rejects new orders, keeps resting orders, accepts cancels
        - `cancel_only`: accepts cancels only
        - `delisted`: hidden (never returned by this API)
      enum: [active, halted, cancel_only, delisted]

    SelfTradePolicy:
      type: string
      description: What happens when a new order would trade against the same account's resting order. v1 implements `cancel_newest`.
      enum: [cancel_newest, allow, cancel_oldest]

    Market:
      type: object
      description: A spot trading pair with its precision and fee configuration.
      required:
        - symbol
        - base_asset
        - quote_asset
        - price_tick
        - qty_step
        - min_notional
        - maker_bps
        - taker_bps
        - self_trade_policy
        - status
      properties:
        symbol:
          type: string
          example: ETH-USDC
        base_asset:
          type: string
          description: Symbol of the asset being bought or sold.
          example: ETH
        quote_asset:
          type: string
          description: Symbol of the asset prices are expressed in.
          example: USDC
        price_tick:
          $ref: "#/components/schemas/Amount"
        qty_step:
          $ref: "#/components/schemas/Amount"
        min_notional:
          $ref: "#/components/schemas/Amount"
        max_qty:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Maximum order quantity; absent when unlimited.
        max_slippage_bps:
          type: integer
          format: int32
          description: Market-order protection band relative to the best price, in basis points; absent when unlimited.
          minimum: 1
          maximum: 10000
        maker_bps:
          type: integer
          format: int32
          description: Maker fee in basis points, charged in the asset the maker receives.
          example: 10
        taker_bps:
          type: integer
          format: int32
          description: Taker fee in basis points, charged in the asset the taker receives.
          example: 20
        self_trade_policy:
          $ref: "#/components/schemas/SelfTradePolicy"
        status:
          $ref: "#/components/schemas/MarketStatus"

    MarketList:
      type: object
      required: [markets]
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/Market"

    # --- trading ---

    Side:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [limit, market]

    TimeInForce:
      type: string
      description: "`gtc` rests the unfilled remainder in the book; `ioc` cancels it. Market orders are always `ioc`."
      enum: [gtc, ioc]

    OrderStatus:
      type: string
      description: docs/plan-v1.0.md §6.2; `filled`, `cancelled` and `rejected` are terminal
      enum: [open, partially_filled, filled, cancelled, rejected]

    PlaceOrderRequest:
      type: object
      required: [client_order_id, market, side, type]
      properties:
        client_order_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Idempotency key per account; reuse with different content is 422
        market:
          type: string
          example: ETH-USDC
        side:
          $ref: "#/components/schemas/Side"
        type:
          $ref: "#/components/schemas/OrderType"
        time_in_force:
          $ref: "#/components/schemas/TimeInForce"
        price:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Limit orders only; must be a multiple of `price_tick`
        qty:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Base quantity (limit orders and market sells); multiple of `qty_step`
        quote_qty:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Quote budget of a market buy

    Order:
      type: object
      required:
        - id
        - client_order_id
        - market
        - side
        - type
        - time_in_force
        - filled_qty
        - filled_quote
        - remaining_qty
        - hold_asset
        - hold_amount
        - hold_remaining
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: ULID
        client_order_id:
          type: string
        market:
          type: string
        side:
          $ref: "#/components/schemas/Side"
        type:
          $ref: "#/components/schemas/OrderType"
        time_in_force:
          $ref: "#/components/schemas/TimeInForce"
        price:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Absent for market orders
        qty:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Absent for market buys
        quote_qty:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Quote budget of a market buy
        filled_qty:
          $ref: "#/components/schemas/Amount"
        filled_quote:
          $ref: "#/components/schemas/Amount"
        remaining_qty:
          $ref: "#/components/schemas/Amount"
        hold_asset:
          type: string
          description: Asset frozen for this order (quote for buys, base for sells)
        hold_amount:
          $ref: "#/components/schemas/Amount"
        hold_remaining:
          $ref: "#/components/schemas/Amount"
        status:
          $ref: "#/components/schemas/OrderStatus"
        reject_reason:
          type: string
          x-go-type-skip-optional-pointer: true
          description: invalid_price_tick | invalid_qty_step | below_min_notional | above_max_qty | market_not_active | insufficient_balance | empty_book | quote_qty_too_small | account_frozen | policy_denied
        cancel_reason:
          type: string
          x-go-type-skip-optional-pointer: true
          description: user | ioc | self_trade | price_protection
        seq:
          type: integer
          format: int64
          description: Engine sequence of the command that processed the order
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    Trade:
      type: object
      description: One public fill; price is always the resting (maker) price
      required: [trade_id, market, price, qty, quote_qty, taker_side, seq, executed_at]
      properties:
        trade_id:
          type: string
        market:
          type: string
        price:
          $ref: "#/components/schemas/Amount"
        qty:
          $ref: "#/components/schemas/Amount"
        quote_qty:
          $ref: "#/components/schemas/Amount"
        taker_side:
          $ref: "#/components/schemas/Side"
        seq:
          type: integer
          format: int64
        executed_at:
          type: string
          format: date-time

    TradeList:
      type: object
      required: [trades]
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"

    Fill:
      allOf:
        - $ref: "#/components/schemas/Trade"
        - type: object
          description: The caller's side of a trade
          required: [order_id, side, is_maker, fee, fee_asset]
          properties:
            order_id:
              type: string
            side:
              $ref: "#/components/schemas/Side"
            is_maker:
              type: boolean
            fee:
              $ref: "#/components/schemas/Amount"
            fee_asset:
              type: string

    FillList:
      type: object
      required: [fills]
      properties:
        fills:
          type: array
          items:
            $ref: "#/components/schemas/Fill"

    OrderResult:
      type: object
      required: [order, trades]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        trades:
          type: array
          description: Fills of this order (for `POST`, those produced by the command)
          items:
            $ref: "#/components/schemas/Fill"

    # --- market data ---

    Level:
      type: object
      required: [price, qty, orders]
      properties:
        price:
          $ref: "#/components/schemas/Amount"
        qty:
          $ref: "#/components/schemas/Amount"
        orders:
          type: integer
          format: int32

    Depth:
      type: object
      required: [market, last_seq, bids, asks]
      properties:
        market:
          type: string
        last_seq:
          type: integer
          format: int64
          description: |
            Engine sequence the snapshot reflects; WebSocket depth deltas
            continue from it (docs/ws-api.md). The snapshot may come from the
            stream role's cache rather than the engine, at most a few hundred
            milliseconds behind, and is always consistent with its levels.
        bids:
          type: array
          description: Best (highest) bid first
          items:
            $ref: "#/components/schemas/Level"
        asks:
          type: array
          description: Best (lowest) ask first
          items:
            $ref: "#/components/schemas/Level"

    KlineInterval:
      type: string
      description: Candle width; buckets are aligned to UTC
      enum: [1m, 5m, 15m, 1h, 1d]

    Kline:
      type: object
      description: One OHLCV bucket. `trades` is 0 on a synthesized candle that carries the previous close through an empty bucket.
      required: [market, interval, start, open, high, low, close, volume, quote_volume, trades]
      properties:
        market:
          type: string
        interval:
          $ref: "#/components/schemas/KlineInterval"
        start:
          type: string
          format: date-time
          description: Bucket start (UTC)
        open:
          $ref: "#/components/schemas/Amount"
        high:
          $ref: "#/components/schemas/Amount"
        low:
          $ref: "#/components/schemas/Amount"
        close:
          $ref: "#/components/schemas/Amount"
        volume:
          $ref: "#/components/schemas/Amount"
        quote_volume:
          $ref: "#/components/schemas/Amount"
        trades:
          type: integer
          format: int64

    KlineList:
      type: object
      required: [market, interval, klines]
      properties:
        market:
          type: string
        interval:
          $ref: "#/components/schemas/KlineInterval"
        klines:
          type: array
          description: Oldest first, one per bucket
          items:
            $ref: "#/components/schemas/Kline"

    Ticker:
      type: object
      description: Rolling 24-hour summary. The price fields are omitted when the window holds no trade.
      required: [market, volume, quote_volume, trades, at]
      properties:
        market:
          type: string
        last_price:
          $ref: "#/components/schemas/Amount"
        open:
          $ref: "#/components/schemas/Amount"
          description: First trade price inside the window
        high:
          $ref: "#/components/schemas/Amount"
        low:
          $ref: "#/components/schemas/Amount"
        change:
          $ref: "#/components/schemas/Amount"
          description: last_price − open
        change_pct:
          $ref: "#/components/schemas/Amount"
          description: change / open × 100, truncated to two decimals
        volume:
          $ref: "#/components/schemas/Amount"
          description: Base volume inside the window
        quote_volume:
          $ref: "#/components/schemas/Amount"
        trades:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
          description: When the summary was computed

    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type; `about:blank` when the HTTP status says it all.
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          x-go-type-skip-optional-pointer: true
          example: market NOPE-USDC does not exist
        instance:
          type: string
          description: Request path the problem occurred on.
          x-go-type-skip-optional-pointer: true
          example: /v1/markets/NOPE-USDC
        correlation_id:
          type: string
          description: Value of `X-Request-Id`; quote it when reporting problems.
          x-go-type-skip-optional-pointer: true
          example: 7d5a9c1e0b2f4a6c8e1d3f5a7b9c0d2e
