openapi: 3.0.3
info:
  title: Exchange Admin API
  version: 1.0.0-phase2
  description: |
    Operator API of the white-label exchange engine (docs/plan-v1.0.md §7.4).
    Every write is recorded in the audit trail.

    Phase 2 scope: ledger accounts, balances, journal entries, trial balance,
    administrator adjustments and the audit log. Authentication is a static
    admin API key (`X-Admin-Api-Key`, `ADMIN_API_KEY`) until Phase 5 adds
    admin sessions with TOTP and scoped admin API keys.

    Conventions are those of the public API: decimal strings for money,
    RFC 7807 problems with `correlation_id`, `X-Request-Id` echo.
servers:
  - url: http://localhost:8082
    description: Local development (`make up-single`, admin role on :8082)
security:
  - AdminApiKey: []
tags:
  - name: accounts
  - name: users
  - name: ledger
  - name: registry
  - name: audit
  - name: withdrawals
  - name: chain
  - name: reconciliation
  - name: webhooks
  - name: system

paths:
  /admin/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: >
        The operator's directory. `email` is a fragment matched anywhere in
        the address (no wildcards). Newest first.
      parameters:
        - name: email
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Get one user
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/users/{id}/kyc-level:
    put:
      tags: [users]
      operationId: setUserKycLevel
      summary: Set a user's KYC level
      description: >
        The withdrawal policy reads the level on each request, so the next
        withdrawal is decided under the new limits; nothing already pending is
        re-decided. Publishes `user.kyc_level_updated` when the level changes.
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycLevelRequest"
      responses:
        "200":
          description: Updated user (unchanged when already at that level)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/users/{id}/status:
    put:
      tags: [users]
      operationId: setUserStatus
      summary: Freeze or release a user
      description: >
        Frozen means the user cannot log in, refresh a token or use an API
        key, and their spot account is frozen in the same transaction (no
        orders, no withdrawals). An access token already issued lasts its
        fifteen minutes. Releasing reverses all of it. Refuses to freeze the
        last active administrator. Publishes `user.status_updated` when the
        status changes.
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusRequest"
      responses:
        "200":
          description: Updated user (unchanged when already in that status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List ledger accounts
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AccountKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Open a spot account
      description: Phase 2 dev/admin path; from Phase 3 registration opens the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get one account
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/accounts/{id}/status:
    put:
      tags: [accounts]
      operationId: setAccountStatus
      summary: Freeze or reactivate an account
      parameters:
        - $ref: "#/components/parameters/AccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/accounts/{id}/balances:
    get:
      tags: [ledger]
      operationId: getAccountBalances
      summary: Cached balances of a spot account
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/assets:
    get:
      tags: [registry]
      operationId: listAssets
      summary: Assets of the tenant
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [registry]
      operationId: createAsset
      summary: List a new asset
      description: >
        Publishes asset.updated with changed_fields ["created"]. A market can
        reference the asset from then on; deposits and withdrawals follow the
        two enabled flags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/assets/{symbol}:
    get:
      tags: [registry]
      operationId: getAsset
      summary: Get one asset
      parameters:
        - $ref: "#/components/parameters/AssetSymbol"
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [registry]
      operationId: updateAsset
      summary: Edit an asset
      description: >
        Replaces every writable field. Publishes asset.updated naming the
        fields that changed; a body equal to the current row changes nothing
        and emits no event. The scale cannot shrink below what any market on
        the asset needs.
      parameters:
        - $ref: "#/components/parameters/AssetSymbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRequest"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/fee-schedules:
    get:
      tags: [registry]
      operationId: listFeeSchedules
      summary: Fee schedules of the tenant
      responses:
        "200":
          description: Fee schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [registry]
      operationId: createFeeSchedule
      summary: Add a fee schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeeScheduleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/fee-schedules/{name}:
    put:
      tags: [registry]
      operationId: updateFeeSchedule
      summary: Change a fee schedule's rates
      description: >
        Every market on the schedule pays the new rates from the next trade.
        Publishes fee_schedule.updated (and no market.updated for the markets
        on it; the engine reloads its whole cache on either).
      parameters:
        - $ref: "#/components/parameters/FeeScheduleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeScheduleRequest"
      responses:
        "200":
          description: Updated fee schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/withdrawal-limits:
    get:
      tags: [registry]
      operationId: listWithdrawalLimits
      summary: Withdrawal limits per asset and KYC level
      responses:
        "200":
          description: Withdrawal limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalLimitList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/withdrawal-limits/{asset}/{kyc_level}:
    put:
      tags: [registry]
      operationId: setWithdrawalLimit
      summary: Set the limits of one asset at one KYC level
      description: >
        Creates the row when there is none. The withdrawal policy reads the
        limits on each request, so the next withdrawal is decided under the
        new ones. No event: nothing caches these.
      parameters:
        - $ref: "#/components/parameters/AssetPath"
        - $ref: "#/components/parameters/KycLevelPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalLimitRequest"
      responses:
        "200":
          description: The limits now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/engine/reload:
    post:
      tags: [registry]
      operationId: requestReload
      summary: Ask every engine to reload its registry cache
      description: >
        Publishes registry.reload with no row changed: after a seed, or when in
        doubt. 202: the request is in the outbox; the engine's reload consumer
        acts on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReloadRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReloadAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/markets:
    get:
      tags: [registry]
      operationId: listMarkets
      summary: Markets of the tenant
      responses:
        "200":
          description: Markets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [registry]
      operationId: createMarket
      summary: List a new market
      description: >
        Assets and the fee schedule are referenced by symbol and name, and
        must exist. Publishes market.updated with changed_fields ["created"];
        the engine opens the book on reload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/markets/{symbol}:
    get:
      tags: [registry]
      operationId: getMarket
      summary: Get one market
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [registry]
      operationId: updateMarket
      summary: Edit a market
      description: >
        Replaces every writable field, status included. Publishes
        market.updated naming the fields that changed; a body equal to the
        current row changes nothing and emits no event. Precision must still
        fit the assets (price_tick within the quote scale, qty_step within the
        base scale).
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketRequest"
      responses:
        "200":
          description: Updated market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/markets/{symbol}/status:
    put:
      tags: [registry]
      operationId: setMarketStatus
      summary: Halt, resume or delist a market
      description: >
        Changes the market's trading status and publishes market.updated, which
        the engine consumes to reload its registry cache without a restart.
        Setting the status a market already has changes nothing and emits no
        event. The path parameter is the symbol, matching GET /v1/markets/{symbol}.
      parameters:
        - $ref: "#/components/parameters/MarketSymbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketStatusRequest"
      responses:
        "200":
          description: Updated market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/withdrawals:
    get:
      tags: [withdrawals]
      operationId: listWithdrawalsForReview
      summary: The withdrawal review queue
      description: >
        Withdrawals the policy sent to a person, oldest first: whoever has
        waited longest is served first. A withdrawal is here because it broke a
        limit, not because it is illegitimate (docs/plan-v1.0.md §6.4.2).
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Withdrawals awaiting review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/withdrawals/{id}/review:
    post:
      tags: [withdrawals]
      operationId: reviewWithdrawal
      summary: Approve or reject a withdrawal awaiting review
      description: >
        Approving does **not** move money: it marks the withdrawal for the
        chain worker, which locks the funds and hands it to the signer. That
        separation is enforced by the column grants — admin writes the review
        columns, the chain role writes the hold — so no single role can both
        authorise a withdrawal and act on it. Only a withdrawal in
        `pending_review` can be decided; anything else is 409.
      parameters:
        - $ref: "#/components/parameters/WithdrawalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalReviewRequest"
      responses:
        "200":
          description: The reviewed withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/withdrawals/{id}/resolve:
    post:
      tags: [withdrawals]
      operationId: resolveWithdrawal
      summary: Unstick a withdrawal the machine could not finish
      description: >
        Four resolutions, and which one is legal depends on where the
        withdrawal stopped (docs/plan-v1.0.md §6.4.2).


        A `broadcast` withdrawal has a transaction in flight and its amount in
        `pending_withdrawal`: `bump` re-sends it on the same nonce with a
        higher fee, past the automatic replacement limit; `cancel_nonce`
        displaces it with a self-transfer on that nonce. Neither moves money
        now — the refund for a cancellation happens when the displacement is
        mined, because until then the original can still win the race.


        A `failed`/`on_chain` withdrawal has a transaction that reverted, gas
        spent, and its amount still in `pending_withdrawal`: `refund` returns
        the amount to the user and ends the withdrawal, `retry` puts it back on
        hold and sends the row round again with a fresh nonce.


        Anything else is 409 — including a bump on a withdrawal already being
        cancelled, which would bid against our own displacement.
      parameters:
        - $ref: "#/components/parameters/WithdrawalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalResolveRequest"
      responses:
        "200":
          description: The withdrawal after the resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/sweeps:
    get:
      tags: [chain]
      operationId: listSweeps
      summary: Recent collections into the hot wallet
      description: >
        Sweeps move deposits from the per-account addresses they landed on to
        the hot wallet withdrawals are paid from (docs/plan-v1.0.md §6.4.3).
        No user balance is involved: a sweep moves the exchange's own custody
        between two of its own house accounts.


        A native sweep is one transaction. A token sweep is two, because an
        address that has only ever received tokens holds no ether and cannot
        pay for its own transfer, so the hot wallet funds it first —
        `gas_funding_tx_hash` is that leg.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sweeps, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/ledger/trial-balance:
    get:
      tags: [ledger]
      operationId: getTrialBalance
      summary: Trial balance per asset (must be zero) and house account balances
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/ledger/entries:
    get:
      tags: [ledger]
      operationId: listEntries
      summary: Journal entries with postings, newest first
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
        - name: ref_type
          in: query
          schema:
            type: string
        - name: ref_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/ledger/adjustments:
    post:
      tags: [ledger]
      operationId: createAdjustment
      summary: Post a manual adjustment against the external account
      description: |
        `credit` adds to the account's available balance (the development
        faucet, or a correction in the user's favour); `debit` removes from it.
        A reason is mandatory and the call is recorded in the audit trail.
        Repeating the same `idempotency_key` returns the original entry with
        HTTP 200 instead of 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "200":
          description: Already posted (idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Insufficient balance for a debit adjustment
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/ledger/house-adjustments:
    post:
      tags: [ledger]
      operationId: createHouseAdjustment
      summary: Record value that entered or left custody outside this ledger
      description: |
        Books a custody account against `external` (docs/plan-v1.0.md §6.1.4 g).
        `credit` means custody gains, `debit` means it loses.

        This is how money that moved without a transaction this system produced
        gets recorded: a faucet funding the hot wallet, coins moved in from cold
        storage, or the resolution of a reconciliation break whose cause has
        been established. Until it is recorded, `GET /admin/v1/reconciliation`
        reports it as a break — correctly, because the ledger does not know
        about it.

        Only `custody_hot` and `custody_deposit_addresses` are accepted. They
        are the accounts backed by an address somebody else can send to;
        `fee_revenue`, `gas_expense` and `pending_withdrawal` are derived from
        entries this system makes, so adjusting one of those would hide a bug
        rather than record a fact.

        A reason is mandatory and the call is recorded in the audit trail.
        Repeating the same `idempotency_key` returns the original entry with
        HTTP 200 instead of 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseAdjustmentRequest"
      responses:
        "201":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "200":
          description: Already posted (idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/deposits:
    get:
      tags: [chain]
      operationId: listDeposits
      summary: Deposits the chain role has seen, newest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [detected, confirming, credited, orphaned, dropped, reversed]
        - name: asset
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepositList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/hot-wallet:
    get:
      tags: [chain]
      operationId: getHotWallet
      summary: The hot wallet, as the chain role keeps it
      description: >
        Address, next nonce and the low-balance alert state from
        chain.hot_wallets, with the ledger's custody_hot balance per asset. The
        chain's own figure is what reconciliation compares that balance to.
        404 until the chain role has started once against this chain.
      responses:
        "200":
          description: Hot wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotWallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/reconciliation/reports:
    get:
      tags: [reconciliation]
      operationId: listReconciliationReports
      summary: Reconciliation passes, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/reconciliation/breaks:
    get:
      tags: [reconciliation]
      operationId: listReconciliationBreaks
      summary: Every break on record, both kinds, newest first
      description: >
        Two families with different terms. A chain break is one asset of one
        reconciliation pass whose on-chain custody did not match the ledger's;
        the chain role writes it (docs/plan-v1.0.md §6.4.4). A ledger break is
        one asset whose debits and credits do not agree, found by the admin
        role checking the ledger against itself; it has an open/resolved state
        because the condition can end.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Breaks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationBreaks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/reconciliation:
    get:
      tags: [reconciliation]
      operationId: getReconciliation
      summary: The latest comparison of ledger custody against on-chain balances
      description: |
        Per asset: what the ledger says the exchange holds on chain
        (`custody_deposit_addresses + custody_hot`) against what the chain says
        (every deposit address plus the hot wallet), read at one block
        (docs/plan-v1.0.md §6.4.4).

        The two sides never look at the same moment, so two corrections are
        applied and both are reported: `uncredited` is what the chain shows at
        or below the frontier that the ledger has not credited yet, and
        `above_frontier` is what the ledger booked for transactions mined above
        it. `in_flight` is what has been spent without being booked. `diff` is
        what is left after all of them, and it should be exactly zero — the
        arithmetic is exact, so there is no tolerance and no threshold.

        A read, not a run. The admin role has no node, so it cannot produce a
        report any more than it can sign a withdrawal; the chain role writes
        one on its own schedule (`ETH_RECONCILE_INTERVAL`) and this shows the
        most recent. 404 until the first one has been written.
      responses:
        "200":
          description: The most recent reconciliation pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: Audit trail, newest first
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: actor_type
          in: query
          schema:
            type: string
            enum: [user, admin, system, api_key]
        - name: actor_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhookEndpoints
      summary: Webhook endpoints, disabled ones included
      description: Signing secrets are never returned; they are shown once, when the endpoint is created.
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [webhooks]
      operationId: createWebhookEndpoint
      summary: Register an endpoint to receive events
      description: |
        Returns the signing secret exactly once. It is stored encrypted and no
        later response can produce it, so an operator who loses it has to
        rotate rather than look it up.

        There is no way to delete an endpoint, deliberately: the delivery
        history has to outlive the integration, so an endpoint that is finished
        with is set to `disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
      responses:
        "201":
          description: Created; store the secret now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks/{id}:
    put:
      tags: [webhooks]
      operationId: updateWebhookEndpoint
      summary: Replace an endpoint's URL, subscriptions and label
      description: >
        A whole replacement of the mutable configuration, so `url` and `events`
        are required even when only one of them is changing. The signing secret
        is not part of it, and neither is the status, which has its own
        endpoint because turning an integration off is a different decision
        from editing it.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdateRequest"
      responses:
        "200":
          description: The endpoint after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks/{id}/status:
    put:
      tags: [webhooks]
      operationId: setWebhookEndpointStatus
      summary: Enable or disable an endpoint
      description: >
        Disabling also drops whatever is still queued for the endpoint. Queued
        deliveries to an inactive endpoint are not pending but unreachable, and
        leaving them would fire a batch of stale events at the customer
        whenever the integration was turned back on. The delivery history is
        untouched, and the number dropped is recorded in the audit trail.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointStatusRequest"
      responses:
        "200":
          description: The endpoint after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Issue a new signing secret and keep the old one for a grace period
      description: >
        The new secret is in this response and nowhere else. Until
        previous_secret_until, every delivery carries two signatures,
        `v1=<new>,v1=<old>`, so a receiver that has switched and one that has
        not both keep verifying; after it, only the new one signs. Rotating
        again inside the grace period replaces the old secret: the newest two
        are the only ones ever valid.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateSecretRequest"
      responses:
        "200":
          description: The new secret, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatedWebhookSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: Delivery attempts for one endpoint, newest first
      description: >
        One row per attempt, not per event. `run_id` groups the attempts that
        belong to one pass through the retry schedule, so a replay's attempts
        are distinguishable from the original's, and `attempt` is the step
        within that run. A null `response_status` means the endpoint never
        answered at all -- a timeout, a refused connection, a bad name -- which
        is a different problem from a rejection.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Delivery attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/webhooks/{id}/deliveries/{delivery_id}/replay:
    post:
      tags: [webhooks]
      operationId: replayWebhookDelivery
      summary: Send the event behind a delivery again
      description: |
        Queues a new run of the event this delivery belongs to. The delivery
        itself does not change -- the table is append-only -- and the replay's
        attempts join it under a new `run_id`, restarting the retry schedule
        from its first step.

        202, not 200: nothing has been sent yet. The worker picks the run up on
        its next tick, and the response says when that is due.

        The customer will receive the event a second time, with the same
        `event_id`. That is what a replay is; `docs/webhooks.md` tells them to
        deduplicate on it.

        409 has two causes and the detail distinguishes them: the event is
        still queued for this endpoint, so the schedule is going to send it
        anyway; or the endpoint is disabled, and a replay would queue work
        nothing can pick up.
      parameters:
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/WebhookDeliveryID"
      responses:
        "202":
          description: Queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReplay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: What the dashboard shows
      description: |
        One read of the things an operator checks first thing: whether the
        ledger balances, what the last reconciliation found, and how much is
        waiting on a person. Counts are capped where noted; a tile that says
        "500+" has made its point.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    AdminApiKey:
      type: apiKey
      in: header
      name: X-Admin-Api-Key

  parameters:
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssetSymbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        example: USDC
    AssetPath:
      name: asset
      in: path
      required: true
      schema:
        type: string
        example: ETH
    KycLevelPath:
      name: kyc_level
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 2
    FeeScheduleName:
      name: name
      in: path
      required: true
      schema:
        type: string
        example: default
    MarketSymbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        example: ETH-USDC
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    WithdrawalID:
      name: id
      in: path
      required: true
      schema:
        type: string

    WebhookEndpointID:
      name: id
      in: path
      required: true
      schema:
        type: string
    WebhookDeliveryID:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or wrong admin API key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource is not in a state that allows this
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Amount:
      type: string
      description: Decimal serialized as a string (NUMERIC(36,18)); never a JSON number.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: "1990.00"
      x-go-type: money.Amount
      x-go-type-import:
        path: github.com/arc119226/crypto-exchange/internal/money

    AdminWithdrawal:
      type: object
      required: [id, account_id, asset, amount, to_address, chain_id, status, created_at]
      properties:
        id: { type: string }
        account_id: { type: string }
        asset: { type: string }
        amount:
          $ref: "#/components/schemas/Amount"
        to_address: { type: string }
        chain_id: { type: integer, format: int64 }
        status: { type: string }
        tx_hash:
          type: string
          nullable: true
          description: >
            The transaction now representing this withdrawal: the displacement
            while a cancellation is in flight, otherwise the withdrawal's own.
        failure_reason: { type: string, nullable: true }
        review_note: { type: string, nullable: true }
        reviewed_by: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminWithdrawalList:
      type: object
      required: [withdrawals]
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/AdminWithdrawal"

    WithdrawalReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          maxLength: 500
          description: Why. Recorded on the withdrawal and in the audit trail.

    WithdrawalResolveRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [bump, cancel_nonce, refund, retry]
        note:
          type: string
          maxLength: 500
          description: >
            Why. Required: every one of these actions is a person overriding
            the machine, and the audit trail is the only place that reason
            survives.

    Sweep:
      type: object
      required: [id, chain_id, from_address, asset, amount, status, created_at]
      properties:
        id: { type: string }
        chain_id: { type: integer, format: int64 }
        from_address:
          type: string
          description: The deposit address that was emptied, lower-case.
        asset: { type: string }
        amount:
          $ref: "#/components/schemas/Amount"
        status:
          type: string
          description: requested, gas_funded, broadcast, confirmed or failed.
        failure_reason: { type: string, nullable: true }
        tx_hash: { type: string, nullable: true }
        gas_funding_tx_hash:
          type: string
          nullable: true
          description: The ether the hot wallet sent so the address could pay for its own transfer; null for a native sweep.
        gas_cost:
          allOf:
            - $ref: "#/components/schemas/Amount"
          nullable: true
          description: What the sweep transaction burned, always in the chain's native coin — which is not necessarily `asset`.
        block_number: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SweepList:
      type: object
      required: [sweeps]
      properties:
        sweeps:
          type: array
          items:
            $ref: "#/components/schemas/Sweep"

    AccountKind:
      type: string
      enum: [spot, house]

    AccountStatus:
      type: string
      enum: [active, frozen]

    HouseCode:
      type: string
      enum: [fee_revenue, gas_expense, custody_hot, custody_deposit_addresses, pending_withdrawal, external]

    Account:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AccountKind"
        house_code:
          allOf:
            - $ref: "#/components/schemas/HouseCode"
          description: Present for house accounts only.
        owner_user_id:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/AccountStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    CreateAccountRequest:
      type: object
      properties:
        owner_user_id:
          type: string
          description: Optional until Phase 3 introduces users.

    AccountStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/AccountStatus"
        reason:
          type: string
          minLength: 1

    UserStatus:
      type: string
      enum: [active, frozen]

    UserRole:
      type: string
      enum: [user, admin]

    User:
      type: object
      required: [id, email, role, kyc_level, status, totp_enabled, version, created_at, updated_at]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        kyc_level:
          type: integer
          minimum: 0
          maximum: 2
        status:
          $ref: "#/components/schemas/UserStatus"
        totp_enabled:
          type: boolean
          description: Only ever true for administrators.
        version:
          type: integer
          format: int32
          description: Increases on every edit.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    KycLevelRequest:
      type: object
      required: [kyc_level, reason]
      properties:
        kyc_level:
          type: integer
          minimum: 0
          maximum: 2
        reason:
          type: string
          minLength: 1

    UserStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/UserStatus"
        reason:
          type: string
          minLength: 1

    MarketStatus:
      type: string
      enum: [active, halted, cancel_only, delisted]
      description: >
        active takes orders and cancels; halted and cancel_only take cancels
        only; delisted requires an empty book (docs/plan-v1.0.md 6.6).

    MarketStatusRequest:
      type: object
      required: [status, reason]
      properties:
