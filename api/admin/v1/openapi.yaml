    ReconciliationLine:
      type: object
      required:
        [asset, block_height, ledger_total, chain_total, uncredited, above_frontier, in_flight, diff, balanced]
      properties:
        asset:
          type: string
        block_height:
          type: integer
          format: int64
          description: The block every balance in this line was read at.
        ledger_total:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: >
            custody_deposit_addresses + custody_hot. Can be negative: custody_hot
            goes negative between a withdrawal and the sweep that refills it.
        chain_total:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Every controlled deposit address plus the hot wallet, at block_height.
        uncredited:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Deposits the chain shows at or below block_height that the ledger has not credited yet.
        above_frontier:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: The net effect the ledger booked for transactions mined above block_height.
        in_flight:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: What has been spent at or below block_height without the ledger having booked it.
        diff:
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: >
            chain_total - ledger_total + above_frontier - uncredited + in_flight.
            Positive means the chain holds more than the ledger claims; negative
            means it holds less, which is the one that cannot wait.
        balanced:
          type: boolean
          description: true when diff is exactly zero.

