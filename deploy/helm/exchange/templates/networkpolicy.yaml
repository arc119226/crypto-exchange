{{- if .Values.networkPolicy.enabled }}
# Who may talk to whom (docs/plan-v1.0.md §14): the ops port only from the
# monitoring namespace, the api and stream listeners from anywhere in the
# cluster (the Ingress controller), the admin listener from the same
# namespace only. Egress is left open: the roles reach Postgres, NATS, Redis,
# the chain RPC and webhook endpoints wherever those live.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "exchange.fullname" . }}
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "exchange.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 9100
    - ports:
        - port: 8080
        - port: 8081
    - from:
        - podSelector: {}
      ports:
        - port: 8082
        - port: 9100
{{- end }}
