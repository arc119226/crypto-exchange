{{- if .Values.migrate.enabled }}
# Migrations run before the release's pods change, on install and on every
# upgrade (goose, forward-only, idempotent). A failed migrate fails the
# release; the old pods keep running.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "exchange.fullname" . }}-migrate
  labels:
    {{- include "exchange.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "exchange.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "exchange.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "exchange.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up", "--wait", {{ .Values.migrate.waitForDatabase | quote }}]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DATABASE_URL_FILE
              value: {{ include "exchange.secretsDir" . }}/db/DATABASE_URL_MIGRATE
          volumeMounts:
            - name: db
              mountPath: {{ include "exchange.secretsDir" . }}/db
              readOnly: true
      volumes:
        - name: db
          secret:
            secretName: {{ .Values.secrets.db }}
{{- end }}
