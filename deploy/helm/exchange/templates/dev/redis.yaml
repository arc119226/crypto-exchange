{{- if .Values.dev.enabled }}
{{- $ctx := dict "root" . "name" "redis" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exchange.fullname" . }}-redis
  labels:
    {{- include "exchange.devLabels" $ctx | nindent 4 }}
  annotations:
    {{- include "exchange.devHookAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "exchange.devSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exchange.devSelector" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.dev.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange.fullname" . }}-redis
  labels:
    {{- include "exchange.devLabels" $ctx | nindent 4 }}
  annotations:
    {{- include "exchange.devHookAnnotations" . | nindent 4 }}
spec:
  selector:
    {{- include "exchange.devSelector" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
