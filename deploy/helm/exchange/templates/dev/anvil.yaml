{{- if .Values.dev.enabled }}
{{- $ctx := dict "root" . "name" "anvil" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exchange.fullname" . }}-anvil
  labels:
    {{- include "exchange.devLabels" $ctx | nindent 4 }}
  annotations:
    {{- include "exchange.devHookAnnotations" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "exchange.devSelector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "exchange.devSelector" $ctx | nindent 8 }}
    spec:
      containers:
        - name: anvil
          image: {{ .Values.dev.anvil.image }}
          command: ["anvil"]
          args: ["--host=0.0.0.0", "--chain-id=31337", "--block-time=2", "--accounts=10", "--balance=10000"]
          ports:
            - name: rpc
              containerPort: 8545
          readinessProbe:
            exec:
              command: ["cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange.fullname" . }}-anvil
  labels:
    {{- include "exchange.devLabels" $ctx | nindent 4 }}
  annotations:
    {{- include "exchange.devHookAnnotations" . | nindent 4 }}
spec:
  selector:
    {{- include "exchange.devSelector" $ctx | nindent 4 }}
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
{{- end }}
