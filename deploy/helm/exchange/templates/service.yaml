{{- $root := . -}}
{{- range $role, $spec := .Values.roles }}
{{- if $spec.enabled }}
---
# Every role exposes its ops port (metrics, /readyz); api, stream and admin
# their listener as well.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange.fullname" $root }}-{{ $role }}
  labels:
    {{- include "exchange.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  type: ClusterIP
  selector:
    {{- include "exchange.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  ports:
    - name: ops
      port: 9100
      targetPort: ops
    {{- if eq $role "api" }}
    - name: http
      port: 8080
      targetPort: http
    {{- else if eq $role "stream" }}
    - name: ws
      port: 8081
      targetPort: ws
    {{- else if eq $role "admin" }}
    - name: admin
      port: 8082
      targetPort: admin
    {{- end }}
{{- end }}
{{- end }}
