# Foundry project for the local test chain: MockUSDC + the idempotent deploy
# script that writes /artifacts/addresses.json for `exchange seed`.
# No forge-std: script/Vm.sol declares the few cheatcodes we use, so the
# project builds from a plain checkout without submodules.
[profile.default]
src = "src"
script = "script"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes the deployed addresses to ADDRESSES_OUT. /artifacts is
# where compose mounts the shared volume (the deployer and every exchange role
# see it); "." is the project directory, so a testnet deploy run by hand can
# write the fixtures file somewhere the operator can reach.
fs_permissions = [
    { access = "read-write", path = "/artifacts" },
    { access = "read-write", path = "." },
]

[fmt]
line_length = 120
tab_width = 4
