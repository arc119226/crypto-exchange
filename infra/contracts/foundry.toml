# Foundry project for the local test chain: MockUSDC + the idempotent deploy
# script that writes /artifacts/addresses.json for `exchange seed`.
# No forge-std: script/Vm.sol declares the few cheatcodes we use, so the
# project builds from a plain checkout without submodules.
[profile.default]
src = "src"
script = "script"
test = "test"
out = "out"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes the deployed addresses here (compose mounts the
# `artifacts` volume at /artifacts in the deployer and in every exchange role).
fs_permissions = [{ access = "read-write", path = "/artifacts" }]

[fmt]
line_length = 120
tab_width = 4
