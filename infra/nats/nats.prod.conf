# NATS for the beta VM (deploy/compose/compose.prod.yaml): JetStream on the
# volume, the monitoring port for the healthcheck, and one login every role
# uses. The password comes from the nats_password secret; compose's
# entrypoint wrapper puts it in the environment, and each role carries it
# inside its NATS_URL secret (nats://exchange:<password>@nats:4222).
jetstream {
  store_dir: /data
}
http_port: 8222
authorization {
  user: exchange
  password: $NATS_PASSWORD
}
