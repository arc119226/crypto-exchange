# Prometheus scrape config for the compose stack (docs/plan-v1.0.md §15).
# Targets that are not running under the chosen profile simply show as down.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

# The §15 alert set; compose mounts infra/observability/alerts.yml here.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: exchange
    metrics_path: /metrics
    static_configs:
      - targets: ["exchange-all:9100"]
        labels: { deployment: single }
      - targets:
          - exchange-api:9100
          - exchange-engine:9100
          - exchange-chain:9100
          - exchange-signer:9100
          - exchange-stream:9100
          - exchange-admin:9100
          - exchange-worker:9100
        labels: { deployment: app }

  # The host, from node-exporter: only the production overlay runs it, so a
  # development stack shows this target as down.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
