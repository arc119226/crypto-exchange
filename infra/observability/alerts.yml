# Prometheus alerting rules for the compose stack: the minimal set from
# docs/plan-v1.0.md §15. Prometheus loads this through `rule_files` in
# prometheus.yml; compose mounts it next to that file.
#
# There is no Alertmanager in the compose stack, so firing alerts show in
# the Prometheus UI (http://127.0.0.1:9090/alerts) and on the Grafana
# dashboards that graph the same expressions; wiring a receiver is a
# deployment-time decision (docs/plan-v1.0.md §16).
#
# infra/observability/observability_test.go parses this file and checks that
# every metric each rule reads is one the Go code registers.
groups:
  - name: exchange
    rules:
      - alert: ExchangeNotReady
        # exchange_ready is the process's own /readyz sampled every 10 s;
        # a process that is gone has no sample, which is what `up == 0`
        # catches. Either condition for a minute is the §15 "readyz fails
        # > 1 min".
        expr: exchange_ready == 0 or up{job="exchange"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} has not been ready for a minute"
          description: "Check /readyz on the instance: it names the failing dependency (postgres, nats, engine lock, chain node, ...)."

      - alert: LedgerTrialBalanceBroken
        # Debits and credits per asset must net to zero (docs/plan-v1.0.md §6.1).
        # Any non-zero value means a posting was written outside ledger.Post,
        # which the database roles are supposed to make impossible.
        expr: ledger_trial_balance_diff != 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Trial balance for {{ $labels.asset }} is off by {{ $value }}"
          description: "Stop withdrawals and follow docs/runbooks (ledger break). The admin role's ledger watcher also emits reconciliation.ledger_break_detected."

      - alert: ChainScannerLagging
        expr: chain_scanner_lag_blocks > 20
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Deposit scanner is {{ $value }} blocks behind the head"
          description: "Deposits confirm late. Check the node (ETH_RPC_URL) and the chain role's log; the scanner catches up on its own once the node answers."

      - alert: OutboxBacklog
        expr: outbox_backlog > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} outbox rows are waiting for the relay"
          description: "Webhooks, market data and private pushes are all late. Check NATS (JetStream) and the engine role's relay log."

      - alert: HotWalletLow
        # The threshold is the compose stack's; a deployment sets it to the
        # gas budget it wants (ETH_HOT_WALLET_MIN also drives alert.hot_wallet_low).
        expr: hot_wallet_balance{asset="ETH"} < 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Hot wallet holds {{ $value }} ETH"
          description: "Withdrawals and sweeps need gas. Top up the hot wallet (docs/runbooks)."

      # Fee pricing (docs/plan-v1.0.md §23.3). The withdrawal fee exists to
      # cover the gas a withdrawal costs; if it does not, the exchange loses
      # money on every one, quietly and forever. The comparison is per asset
      # and that is what makes it work: gas is only ever booked against the
      # chain's native coin, so no ERC-20 has a gas series and only the native
      # row can fire.
      #
      # Two caveats an operator reading this should know. The gas side is
      # every gas_expense debit, sweeps and nonce fills included -- §23.5
      # defines it that way, on the grounds that they are all the cost of
      # custody the fee has to cover. And the `or ... * 0` is deliberate: with
      # the rate at zero there is no fee series at all, and a bare comparison
      # would go silent in exactly the case the alert is for. A stack running
      # at the shipped rates therefore fires this once it has paid any gas,
      # which is the correct answer to "the fee is below what a withdrawal
      # costs" -- zero is below it.
      - alert: WithdrawalGasExceedsFee
        expr: >
          sum by (asset) (increase(ledger_gas_expense_total[24h]))
          >
          (sum by (asset) (increase(ledger_fee_revenue_total{source="withdrawal"}[24h]))
           or sum by (asset) (increase(ledger_gas_expense_total[24h])) * 0)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.asset }} gas over 24h exceeds the withdrawal fees collected"
          description: "Raise withdrawal_fee or withdrawal_fee_bps for the assets being withdrawn (back office, Assets). The revenue page has the exact figures and the per-withdrawal cost; these counters are float approximations for alerting."

      - alert: WithdrawalsPendingReview
        expr: withdrawals_pending_review > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} withdrawals are waiting for an operator"
          description: "Review them in the back office (Withdrawals page) before customers start asking."

      - alert: ReconciliationBreak
        expr: reconciliation_diff != 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "On-chain vs ledger reconciliation for {{ $labels.asset }} differs by {{ $value }}"
          description: "reconciliation.break_detected carries the numbers; see the Breaks page and docs/runbooks."

      # Backups (docs/runbooks/backup-restore.md). The admin role reads
      # admin.backups every 30 s and exports the newest successful dump and
      # WAL shipment as backup_last_success_timestamp_seconds{kind}; the
      # sidecar (scripts/backup.sh) writes those rows. A daily dump that is
      # more than 26 hours old has missed a day; a WAL archive more than 30
      # minutes old is stale on any system that writes, and archive_timeout
      # = 900 s bounds it on one that does not.
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds{kind="dump"} > 26 * 3600
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "The newest successful pg_dump is {{ $value | humanizeDuration }} old"
          description: "Check the backup sidecar's log and the failed rows in admin.backups; the store may be unreachable or full."

      - alert: WalArchiveStale
        expr: time() - backup_last_success_timestamp_seconds{kind="wal"} > 1800
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "No WAL segment has been shipped for {{ $value | humanizeDuration }}"
          description: "The recovery point is drifting. Check /wal-archive on the Postgres host (segments piling up mean the sidecar cannot upload) and the sidecar's log."

      - alert: BackupNeverTaken
        # A stack that has run for a day without a single successful dump.
        # Development stacks without --profile backup fire this too, after a
        # day, which is the point at which that is worth noticing.
        expr: absent(backup_last_success_timestamp_seconds{kind="dump"})
        for: 24h
        labels: { severity: warning }
        annotations:
          summary: "No backup has ever succeeded on this stack"
          description: "Start the backup profile (docs/runbooks/backup-restore.md) or fix the sidecar."

      # The host's disk, from node-exporter (deploy/compose/compose.prod.yaml
      # runs it; a development stack has no such target and this never
      # evaluates). A full disk stops Postgres, and the WAL archive piling up
      # because the backup sidecar cannot upload is the likeliest way to get
      # there (docs/runbooks/backup-restore.md).
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "The root filesystem has {{ $value | humanizePercentage }} left"
          description: "Check /wal-archive and docker system df first; then grow the disk. Postgres stops when it is full."
