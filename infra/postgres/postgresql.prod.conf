# Postgres for the beta VM (4 vCPU / 8 GB, docs/plan-v1.0.md §16), loaded
# by deploy/compose/compose.prod.yaml through -c config_file. Anything not
# listed keeps Postgres 16's default. The image's initdb-generated
# postgresql.conf in PGDATA is not read once this one is.
listen_addresses = '*'
max_connections = 200

# memory: a quarter of RAM for shared buffers, three quarters as the
# planner's cache estimate; work_mem is per sort, per connection
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL and archiving (docs/runbooks/backup-restore.md): every completed
# segment is copied into /wal-archive for the backup sidecar; archive_timeout
# bounds how old the newest archived segment can be on an idle system
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
archive_timeout = 900
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
synchronous_commit = on

# logging: slow statements, checkpoints and lock waits are what an operator
# reads first; everything goes to stderr, where docker's json-file driver
# rotates it
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d %a '
log_timezone = 'UTC'
timezone = 'UTC'
password_encryption = scram-sha-256
