# golangci-lint v2 configuration. Module boundaries (depguard) and the
# no-float rule (forbidigo) are the enforcement of docs/plan-v1.0.md §6.5/§8.
version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        money:
          list-mode: strict
          files:
            - "**/internal/money/**"
          allow:
            - $gostd
            - github.com/shopspring/decimal
            - github.com/stretchr/testify
            - pgregory.net/rapid
        matching:
          list-mode: strict
          files:
            - "**/internal/matching/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/arc119226/crypto-exchange/internal/matching # external test package
            - github.com/stretchr/testify
            - pgregory.net/rapid
        telemetry:
          list-mode: strict
          files:
            - "**/internal/telemetry/**"
          allow:
            - $gostd
            - github.com/prometheus/client_golang
            - github.com/stretchr/testify
        ledger:
          files:
            - "**/internal/ledger/**"
          deny:
            - pkg: github.com/arc119226/crypto-exchange/internal/trading
              desc: ledger must not depend on trading
            - pkg: github.com/arc119226/crypto-exchange/internal/chain
              desc: ledger must not depend on chain
            - pkg: github.com/arc119226/crypto-exchange/internal/api
              desc: ledger must not depend on api
            - pkg: github.com/arc119226/crypto-exchange/internal/admin
              desc: ledger must not depend on admin
            - pkg: github.com/arc119226/crypto-exchange/internal/registry
              desc: ledger receives fee parameters via ledger.FeeParams, not registry
        eventbus:
          list-mode: strict
          files:
            - "**/internal/eventbus/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/eventbus/sqlcgen
            - github.com/arc119226/crypto-exchange/internal/platform
            - github.com/jackc/pgx/v5
            - github.com/nats-io/nats.go
            - github.com/oklog/ulid/v2
            - github.com/prometheus/client_golang
            - github.com/stretchr/testify
        policy:
          list-mode: strict
          files:
            - "**/internal/policy/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/ledger
            - github.com/arc119226/crypto-exchange/internal/registry
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/stretchr/testify
        trading:
          list-mode: strict
          files:
            - "**/internal/trading/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/trading/sqlcgen
            - github.com/arc119226/crypto-exchange/internal/matching
            - github.com/arc119226/crypto-exchange/internal/ledger
            - github.com/arc119226/crypto-exchange/internal/registry
            - github.com/arc119226/crypto-exchange/internal/policy
            - github.com/arc119226/crypto-exchange/internal/eventbus
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/arc119226/crypto-exchange/internal/platform/pg
            - github.com/jackc/pgx/v5
            - github.com/prometheus/client_golang
            - github.com/stretchr/testify
            - pgregory.net/rapid
        chain:
          list-mode: strict
          files:
            - "**/internal/chain/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/chain
            - github.com/arc119226/crypto-exchange/internal/ledger
            - github.com/arc119226/crypto-exchange/internal/registry
            - github.com/arc119226/crypto-exchange/internal/eventbus
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/arc119226/crypto-exchange/internal/telemetry
            - github.com/arc119226/crypto-exchange/internal/platform/pg
            # §5.1 lists policy among the chain role's modules: the withdrawal
            # worker is where WithdrawalPolicy is applied (§6.4.2).
            - github.com/arc119226/crypto-exchange/internal/policy
            # §6.4.2 requires every withdrawal transition to write an audit
            # event, which is why 0004 grants ex_chain INSERT on audit_events.
            - github.com/arc119226/crypto-exchange/internal/audit
            - github.com/btcsuite/btcd
            - github.com/cosmos/go-bip39
            - github.com/ethereum/go-ethereum
            - github.com/jackc/pgx/v5
            - github.com/prometheus/client_golang
            - github.com/stretchr/testify
            - golang.org/x/crypto
        # docs/plan-v1.0.md §8: the api role imports the address-assignment
        # half of chain, so that half must never reach key derivation.
        chain-assignment:
          files:
            - "**/internal/chain/*.go"
          deny:
            - pkg: github.com/arc119226/crypto-exchange/internal/chain/hdwallet
              desc: address assignment must not import key derivation
        # The signer's NATS transport lives outside internal/chain for the
        # same reason cmdbus lives outside internal/trading: the domain owns
        # the interface and must not depend on the wire.
        signerbus:
          list-mode: strict
          files:
            - "**/internal/signerbus/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/chain/signer
            - github.com/arc119226/crypto-exchange/internal/telemetry
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/ethereum/go-ethereum
            - github.com/nats-io/nats.go
            - github.com/stretchr/testify
        cmdbus:
          list-mode: strict
          files:
            - "**/internal/cmdbus/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/trading
            - github.com/arc119226/crypto-exchange/internal/matching
            - github.com/arc119226/crypto-exchange/internal/auth
            - github.com/arc119226/crypto-exchange/internal/telemetry
            - github.com/arc119226/crypto-exchange/internal/money
            - github.com/nats-io/nats.go
            - github.com/prometheus/client_golang
            - github.com/stretchr/testify
        auth:
          list-mode: strict
          files:
            - "**/internal/auth/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/auth/sqlcgen
            - github.com/arc119226/crypto-exchange/internal/ledger
            - github.com/arc119226/crypto-exchange/internal/audit
            - github.com/arc119226/crypto-exchange/internal/platform/pg
            - github.com/jackc/pgx/v5
            - github.com/lestrrat-go/jwx/v3
            - golang.org/x/crypto
            - github.com/stretchr/testify
        ratelimit:
          list-mode: strict
          files:
            - "**/internal/ratelimit/**"
          allow:
            - $gostd
            - github.com/redis/go-redis/v9
            - github.com/stretchr/testify
        entrypoints-only-from-app:
          files:
            - $all
            - "!**/internal/app/**"
            - "!**/internal/api/**"
            - "!**/internal/admin/**"
            - "!**/internal/stream/**"
            - "!**/test/**"
          deny:
            - pkg: github.com/arc119226/crypto-exchange/internal/api
              desc: only internal/app wires internal/api
            - pkg: github.com/arc119226/crypto-exchange/internal/admin
              desc: only internal/app wires internal/admin
            - pkg: github.com/arc119226/crypto-exchange/internal/stream
              desc: only internal/app wires internal/stream
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - github.com/arc119226/crypto-exchange/internal/app
            - github.com/arc119226/crypto-exchange/internal/telemetry
            - github.com/arc119226/crypto-exchange/internal/money
            # exchangectl replay drives the pure order book directly (no I/O in matching)
            - github.com/arc119226/crypto-exchange/internal/matching
            # exchangectl signs API-key requests with the same canonical string the server verifies
            - github.com/arc119226/crypto-exchange/internal/auth
            - github.com/arc119226/crypto-exchange/cmd/exchangectl/internal
            - github.com/spf13/cobra
            - github.com/oapi-codegen/runtime
            - github.com/stretchr/testify
        nobody-imports-cmd:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/arc119226/crypto-exchange/cmd
              desc: nothing imports cmd
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^strconv\.ParseFloat$
          msg: no floating point on money paths (docs/plan-v1.0.md §6.5)
        - pattern: ^strconv\.FormatFloat$
          msg: no floating point on money paths
        - pattern: ^decimal\.NewFromFloat(32)?$
          msg: construct decimals from strings or integers, never floats
        - pattern: \.InexactFloat64$
          msg: no lossy float conversion on money paths
        - pattern: ^float(32|64)$
          msg: no float types on money paths
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
      - internal/admin/gen
      - internal/registry/sqlcgen
      - internal/ledger/sqlcgen
      - internal/audit/sqlcgen
      - internal/trading/sqlcgen
      - internal/eventbus/sqlcgen
      - internal/auth/sqlcgen
      - cmd/exchangectl/internal/apiclient
      - cmd/exchangectl/internal/adminclient
    rules:
      # forbidigo (no floats) is enforced only in the numeric-sensitive packages
      - path-except: internal/(money|matching|ledger|trading|chain|marketdata|policy)/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/arc119226/crypto-exchange
  exclusions:
    generated: lax
    paths:
      - internal/api/gen
      - internal/admin/gen
      - internal/registry/sqlcgen
      - internal/ledger/sqlcgen
      - internal/audit/sqlcgen
      - internal/trading/sqlcgen
      - internal/eventbus/sqlcgen
      - internal/auth/sqlcgen
      - cmd/exchangectl/internal/apiclient
      - cmd/exchangectl/internal/adminclient
