# gitleaks (CI lint job): default rules plus allowlists for material that is
# public by design. Real secrets live in .env and secrets/ (both gitignored).
title = "crypto-exchange"

[extend]
useDefault = true

[allowlist]
description = "Public anvil dev key, fixture addresses, Solidity sources"
paths = [
  '''^\.env\.example$''',
  '''^test/fixtures/.*\.json$''',
  '''^infra/contracts/.*''',
]
regexes = [
  # anvil account #0 private key — published in Foundry's own documentation
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  # generic-api-key reads the internal/auth package comment ("argon2id
  # passwords, Ed25519-signed JWT access tokens ...") as keyword + separator +
  # high-entropy value. Allowlist regexes match the captured secret, so only
  # this exact English phrase is exempt; the rest of the line is still scanned.
  '''^Ed25519-signed$''',
  # The webhook-sink test's fixture secret. generic-api-key reads
  # `const secret = "whsec_..."` as keyword + separator + high-entropy value,
  # and 16 distinct hex characters score high. It is a literal in
  # cmd/exchangectl/webhook_sink_test.go, never a credential: a real signing
  # secret is 32 bytes (64 hex characters) and is generated per endpoint. As
  # above, this matches only the exact captured string.
  '''^whsec_0123456789abcdef$''',
]
