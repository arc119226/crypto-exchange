{{define "content"}}
<section class="card narrow">
  <h1>{{T "login.title"}}</h1>
  <form method="post" action="/admin/login">
    <label>{{T "login.email"}}
      <input type="email" name="email" value="{{if .Data}}{{.Data.Email}}{{end}}" autocomplete="username" required autofocus>
    </label>
    <label>{{T "login.password"}}
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">{{T "login.continue"}}</button>
  </form>
  <p class="muted">{{T "login.next_step"}}</p>
</section>
{{end}}
